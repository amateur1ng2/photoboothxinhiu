<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f5e8ff,#e6f7ff);
overflow-x:hidden;
}

/* LAYOUT */
.main{
display:grid;
grid-template-columns:260px 1fr 260px;
gap:16px;
max-width:1200px;
margin:20px auto;
padding:0 12px;
}

/* SIDEBAR */
.sidebar{
background:white;
padding:12px;
border-radius:14px;
display:flex;
flex-direction:column;
gap:10px;
}

button{
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.primary{background:#ff5c8a;color:white}
.secondary{background:#7b61ff;color:white}

/* CAMERA */
.camera{
position:relative;
background:black;
border-radius:16px;
overflow:hidden;
aspect-ratio:3/4;
}

.zoom-frame{
width:100%;
height:100%;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:cover;
transform-origin:center;
}

/* LIVE */
.live{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
padding:4px 10px;
border-radius:20px;
font-size:12px;
z-index:2;
}

/* ZOOM */
.zoom-controls{
position:absolute;
bottom:10px;
left:10px;
display:flex;
gap:6px;
z-index:3;
}

.zoom-controls button{
padding:6px 10px;
background:white;
border-radius:8px;
}

/* STICKER */
#layer{
position:absolute;
inset:0;
z-index:2;
}

.sticker{
position:absolute;
font-size:30px;
cursor:grab;
user-select:none;
}

/* RIGHT PANEL */
.panel{
background:white;
border-radius:14px;
padding:12px;
}

#photos{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

.photo img{
width:100%;
border-radius:10px;
}

/* COUNTDOWN */
#countdown{
text-align:center;
font-size:40px;
height:60px;
}

/* CLEAR */
.clear-btn{
background:#222;
color:white;
margin-top:10px;
}

</style>
</head>

<body>

<div class="main">

<!-- LEFT -->
<div class="sidebar">

<button onclick="setSession(2)">2 Photos</button>
<button onclick="setSession(4)">4 Photos</button>
<button onclick="setSession(6)">6 Photos</button>

<hr>

<button onclick="addSticker('💖')">💖</button>
<button onclick="addSticker('✨')">✨</button>

<hr>

<button class="primary" onclick="start()">Start</button>
<button class="secondary" onclick="stopCamera()">Stop</button>
<button class="clear-btn" onclick="clearPreview()">Clear</button>

</div>

<!-- CENTER -->
<div>

<div class="camera">

<div class="live">LIVE</div>

<div class="zoom-frame">
<video id="video" autoplay playsinline></video>
</div>

<div id="layer"></div>

<div class="zoom-controls">
<button onclick="zoomOut()">0.5x</button>
<button onclick="zoomIn()">+</button>
</div>

</div>

<div id="countdown"></div>

</div>

<!-- RIGHT -->
<div class="panel">
<h3>Preview</h3>
<div id="photos"></div>
</div>

</div>

<script>

let stream=null;
let photos=[];
let count=4;

/* zoom: 0.5 = wide, 1 = normal, 2+ = zoom in */
let zoomLevel = 1;

const video=document.getElementById("video");
const layer=document.getElementById("layer");
const photosDiv=document.getElementById("photos");

/* CAMERA */
async function startCamera(){
stream = await navigator.mediaDevices.getUserMedia({video:true});
video.srcObject=stream;
}

function stopCamera(){
if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
video.srcObject=null;
}
}

/* ZOOM (iPhone-like logic) */
function applyZoom(){
const scale = 1 / zoomLevel;
video.style.transform = `scale(${scale})`;
video.style.transition = "0.25s";

document.getElementById("countdown").innerText =
"Zoom: " + zoomLevel.toFixed(1) + "x";
}

function zoomIn(){
zoomLevel += 0.1;
if(zoomLevel > 2.5) zoomLevel = 2.5;
applyZoom();
}

function zoomOut(){
zoomLevel -= 0.1;
if(zoomLevel < 0.5) zoomLevel = 0.5;
applyZoom();
}

/* SESSION */
function setSession(n){
count=n;
}

/* STICKER */
function addSticker(t){
const el=document.createElement("div");
el.className="sticker";
el.innerText=t;

el.style.left="100px";
el.style.top="100px";

layer.appendChild(el);

let drag=false,ox=0,oy=0;

el.onpointerdown=e=>{
drag=true;
ox=e.clientX-el.offsetLeft;
oy=e.clientY-el.offsetTop;
};

document.onpointermove=e=>{
if(!drag)return;
el.style.left=(e.clientX-ox)+"px";
el.style.top=(e.clientY-oy)+"px";
};

document.onpointerup=()=>drag=false;
}

/* PREVIEW */
function addPreview(url){
const div=document.createElement("div");
div.className="photo";

const img=document.createElement("img");
img.src=url;

div.appendChild(img);
photosDiv.appendChild(div);
}

/* CLEAR */
function clearPreview(){
photos=[];
photosDiv.innerHTML="";
}

/* START */
async function start(){

if(!stream) await startCamera();

photos=[];

for(let i=0;i<count;i++){

for(let s=3;s>0;s--){
document.getElementById("countdown").innerText=s;
await new Promise(r=>setTimeout(r,1000));
}

const c=document.createElement("canvas");
c.width=video.videoWidth;
c.height=video.videoHeight;

c.getContext("2d").drawImage(video,0,0);

const url=c.toDataURL();
photos.push(url);

addPreview(url);
}

document.getElementById("countdown").innerText="";
}

</script>

</body>
</html>
