<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
overflow-x:hidden;
}

/* NAV */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 28px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(12px);
box-shadow:0 2px 20px rgba(0,0,0,.08);
}

.logo{font-weight:bold}

nav ul{display:flex;gap:18px;list-style:none}

/* LAYOUT */
.main{
display:grid;
grid-template-columns:240px 1fr 260px;
gap:14px;
max-width:1200px;
margin:18px auto;
padding:0 10px;
}

@media(max-width:1000px){
.main{grid-template-columns:1fr}
}

/* SIDEBAR */
.sidebar{
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:16px;
padding:12px;
display:flex;
flex-direction:column;
gap:8px;
}

/* BUTTONS */
button{
border:none;
padding:8px 10px;
border-radius:10px;
cursor:pointer;
font-weight:600;
font-size:13px;
}

.start{background:#ff5c8a;color:white}
.stop{background:#ff3b3b;color:white}
.reset{background:#7b61ff;color:white}

/* CAMERA */
.camera-box{
position:relative;
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

video{
width:100%;
display:block;
transform-origin:center;
transition:.1s;
}

/* LIVE */
.live{
position:absolute;
top:8px;
left:8px;
display:flex;
align-items:center;
gap:6px;
background:rgba(255,255,255,.85);
padding:5px 10px;
border-radius:12px;
font-size:11px;
}

.dot{
width:7px;height:7px;
background:red;
border-radius:50%;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.6);opacity:.4}
}

/* ZOOM */
.zoom-box{
position:absolute;
bottom:10px;
left:10px;
background:white;
padding:8px;
border-radius:10px;
font-size:12px;
}

/* STICKER */
#layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.sticker{
position:absolute;
font-size:32px;
cursor:grab;
user-select:none;
touch-action:none;
}

/* PREVIEW */
.panel{
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:16px;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
}

.gallery{
display:flex;
flex-direction:column;
gap:8px;
}

.gallery img{
width:100%;
border-radius:10px;
cursor:pointer;
}

/* modal preview */
#modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
}

#modal img{
max-width:80%;
border-radius:12px;
}

</style>
</head>

<body>

<nav>
<div class="logo">📸 Photobooth With Me</div>
<ul><li>Trend</li><li>Frames</li><li>Filters</li></ul>
</nav>

<div class="main">

<!-- LEFT -->
<div class="sidebar">

<button onclick="setPhotos(2)">2 photos</button>
<button onclick="setPhotos(4)">4 photos</button>
<button onclick="setPhotos(6)">6 photos</button>

<hr>

<!-- MORE STICKERS -->
<button onclick="addSticker('💖')">💖</button>
<button onclick="addSticker('✨')">✨</button>
<button onclick="addSticker('🎀')">🎀</button>
<button onclick="addSticker('🐻')">🐻</button>
<button onclick="addSticker('🌸')">🌸</button>
<button onclick="addSticker('💫')">💫</button>
<button onclick="addSticker('🧸')">🧸</button>
<button onclick="addSticker('🍓')">🍓</button>

<hr>

<button class="start" id="start">Start</button>
<button class="stop" id="stop">Stop</button>
<button class="reset" id="reset">Reset</button>

</div>

<!-- CENTER -->
<div>

<div class="camera-box">

<div class="live"><div class="dot"></div> LIVE</div>

<video id="video" autoplay playsinline></video>
<div id="layer"></div>

<div class="zoom-box">
Zoom
<input type="range" id="zoom" min="1" max="2.5" step="0.01">
</div>

</div>

<div id="countdown"></div>

</div>

<!-- RIGHT PREVIEW -->
<div class="panel">
<h3>Preview</h3>
<button onclick="clearGallery()">Clear</button>
<div class="gallery" id="gallery"></div>
</div>

</div>

<!-- MODAL -->
<div id="modal" onclick="this.style.display='none'">
<img id="modalImg">
</div>

<script>

const video=document.getElementById('video');
const layer=document.getElementById('layer');
const gallery=document.getElementById('gallery');
const zoom=document.getElementById('zoom');
const modal=document.getElementById('modal');
const modalImg=document.getElementById('modalImg');

let running=false;
let photoCount=4;
let stickers=[];

/* camera */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* ZOOM REAL */
zoom.oninput=(e)=>{
video.style.transform=`scale(${e.target.value})`;
};

/* STICKER FULL FIX */
function addSticker(icon){

const el=document.createElement('div');
el.className='sticker';
el.innerText=icon;

el.style.left="120px";
el.style.top="120px";

layer.appendChild(el);
stickers.push(el);

let drag=false,ox=0,oy=0;

/* drag */
el.addEventListener('pointerdown',(e)=>{
drag=true;
ox=e.clientX-el.offsetLeft;
oy=e.clientY-el.offsetTop;
el.setPointerCapture(e.pointerId);
});

el.addEventListener('pointermove',(e)=>{
if(!drag) return;
el.style.left=(e.clientX-ox)+'px';
el.style.top=(e.clientY-oy)+'px';
});

el.addEventListener('pointerup',()=>drag=false);

/* resize */
el.addEventListener('wheel',(e)=>{
e.preventDefault();
let s=el.dataset.s?parseFloat(el.dataset.s):1;
s+=e.deltaY*-0.001;
s=Math.max(0.5,Math.min(3,s));
el.dataset.s=s;
el.style.transform=`scale(${s})`;
});
}

/* capture */
function capture(){
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext('2d');
ctx.drawImage(video,0,0);

const url=canvas.toDataURL();

const img=document.createElement('img');
img.src=url;

/* click preview */
img.onclick=()=>{
modal.style.display='flex';
modalImg.src=url;
};

gallery.appendChild(img);
}

/* gallery */
function clearGallery(){
gallery.innerHTML='';
}

/* controls */
document.getElementById('start').onclick=async()=>{
running=true;
layer.innerHTML='';
stickers=[];

for(let i=0;i<photoCount;i++){
if(!running) break;

for(let c=3;c>0;c--){
document.getElementById('countdown').innerText=c;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();
await new Promise(r=>setTimeout(r,600));
}

document.getElementById('countdown').innerText="";
};

document.getElementById('stop').onclick=()=>running=false;

document.getElementById('reset').onclick=()=>{
running=false;
layer.innerHTML='';
stickers=[];
gallery.innerHTML='';
document.getElementById('countdown').innerText="";
};

function setPhotos(n){photoCount=n}

</script>

</body>
</html>
