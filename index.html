<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me v3 FIXED</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f5e8ff,#e6f7ff);
min-height:100vh;
color:#333;
}

nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
}

nav > ul{
display:flex;
gap:20px;
list-style:none;
}

.menu-item{position:relative;}

.menu-item>a{
padding:10px 14px;
border-radius:20px;
color:white !important;
text-decoration:none;
display:block;
}

.trends>a{background:#ff5c8a;}
.styles>a{background:#9b5cff;}
.pose>a{background:#4f8cff;}
.events>a{background:#ffb347;}
.gallerym>a{background:#33c48d;}

.dropdown{
position:absolute;
top:45px;
left:0;
min-width:200px;
background:white;
border-radius:12px;
list-style:none;
padding:8px 0;
box-shadow:0 10px 25px rgba(0,0,0,.15);

opacity:0;
visibility:hidden;
transition:.2s;
z-index:9999;

display:block;
}

.menu-item:hover .dropdown{
opacity:1;
visibility:visible;
}

.dropdown li{display:block;}
.dropdown a{
display:block;
padding:10px;
color:#333 !important;
text-decoration:none;
}
.dropdown a:hover{background:#f2f2f2;}

.camera-card{
background:white;
padding:20px;
border-radius:20px;
position:relative;
overflow:hidden;
}

.photobooth-bg{
position:absolute;
inset:0;
z-index:0;
pointer-events:none;
background:linear-gradient(135deg,#ffe4ec,#f8dfff,#dff7ff);
}

.photobooth-bg span{
position:absolute;
font-size:30px;
opacity:.2;
animation:float 8s linear infinite;
}

@keyframes float{
0%{transform:translateY(0);opacity:0;}
20%{opacity:.3;}
100%{transform:translateY(-600px);opacity:0;}
}

video{
width:100%;
position:relative;
z-index:2;
border-radius:12px;
background:#ddd;
}

.live-badge{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
z-index:10;
}

#countdown{
font-size:60px;
text-align:center;
height:80px;
color:#ff4d6d;
}

.buttons{
display:flex;
gap:10px;
justify-content:center;
margin-top:20px;
}

button{
padding:12px 20px;
border:none;
border-radius:30px;
cursor:pointer;
font-weight:bold;
}

.primary{background:#ff5c8a;color:white;}
.secondary{background:#7b61ff;color:white;}
.dark-btn{background:#222;color:white;}

#photos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px;
margin-top:20px;
}

#photos img{
width:100%;
border-radius:10px;
}

.gallery-grid{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

.gallery-grid img{
width:160px;
border-radius:10px;
}

</style>
</head>

<body>

<nav>
<div class="logo">📸 Photobooth</div>

<ul>
<li class="menu-item trends"><a href="#">Trends</a></li>
<li class="menu-item styles"><a href="#">Styles</a></li>
<li class="menu-item pose"><a href="#">Pose</a></li>
<li class="menu-item events"><a href="#">Events</a></li>
<li class="menu-item gallerym"><a href="#">Gallery</a></li>
</ul>
</nav>

<div class="camera-card">

<div class="live-badge">🔴 LIVE</div>

<div class="photobooth-bg">
<span>📸</span>
<span>✨</span>
<span>💖</span>
<span>🌸</span>
<span>📷</span>
<span>🎞️</span>
</div>

<video id="video" autoplay playsinline></video>
</div>

<div id="countdown"></div>

<div class="buttons">
<button class="primary" id="startBtn">Start</button>
<button class="secondary" id="retakeBtn">Retake</button>
<button class="secondary" id="downloadBtn" style="display:none">Download</button>
</div>

<div id="photos"></div>

<section>
<div class="gallery-grid" id="savedGallery"></div>
</section>

<canvas id="canvas" style="display:none"></canvas>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const photosDiv=document.getElementById("photos");
const countdown=document.getElementById("countdown");
const downloadBtn=document.getElementById("downloadBtn");
const gallery=document.getElementById("savedGallery");

let photos=[];
let cameraStarted=false;

async function startCamera(){
if(cameraStarted) return true;

try{
const stream=await navigator.mediaDevices.getUserMedia({video:true});
video.srcObject=stream;

await new Promise(r=>video.onloadedmetadata=r);
await video.play();

cameraStarted=true;
return true;

}catch(e){
alert("Camera error");
return false;
}
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function capture(){
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext("2d");
ctx.drawImage(video,0,0);

const img=canvas.toDataURL();
photos.push(img);

const el=document.createElement("img");
el.src=img;
photosDiv.appendChild(el);
}

document.getElementById("startBtn").onclick=async()=>{
const ok=await startCamera();
if(!ok) return;

photos=[];
photosDiv.innerHTML="";

let count=4;

for(let i=0;i<count;i++){
for(let c=3;c>0;c--){
countdown.textContent=c;
await sleep(1000);
}
countdown.textContent="📸";
capture();
await sleep(500);
}

countdown.textContent="";
createStrip();
};

document.getElementById("retakeBtn").onclick=()=>{
photos=[];
photosDiv.innerHTML="";
countdown.textContent="";
downloadBtn.style.display="none";
};

function createStrip(){
const strip=document.createElement("canvas");
strip.width=400;
strip.height=photos.length*260+120;

const ctx=strip.getContext("2d");

ctx.fillStyle="white";
ctx.fillRect(0,0,strip.width,strip.height);

let loaded=0;

photos.forEach((src,i)=>{
const img=new Image();

img.onload=()=>{
ctx.drawImage(img,25,i*260+20,350,230);
loaded++;

if(loaded===photos.length){

ctx.fillStyle="#333";
ctx.font="18px Arial";
ctx.textAlign="center";

ctx.fillText("Photobooth With Me",200,strip.height-40);
ctx.fillText(new Date().toLocaleString(),200,strip.height-15);

const url=strip.toDataURL();

downloadBtn.style.display="inline-block";

downloadBtn.onclick=()=>{
const a=document.createElement("a");
a.href=url;
a.download="photobooth.png";
a.click();
};

const g=document.createElement("img");
g.src=url;
gallery.prepend(g);
}
};

img.src=src;
});
}
</script>

</body>
</html>
