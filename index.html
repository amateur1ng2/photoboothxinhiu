<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
min-height:100vh;
color:#333;
}

/* NAV */
nav{
position:sticky;
top:0;
z-index:10;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:rgba(255,255,255,.8);
backdrop-filter:blur(10px);
box-shadow:0 2px 20px rgba(0,0,0,.08);
}

.logo{font-weight:bold}

/* MAIN */
.main{
display:flex;
gap:20px;
max-width:1200px;
margin:auto;
padding:20px;
flex-wrap:wrap;
}

/* SIDEBAR */
.sidebar{
flex:1;
min-width:260px;
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:20px;
padding:18px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

/* CUSTOM DROPDOWN */
.dd{
position:relative;
margin-bottom:15px;
}

.dd-btn{
background:white;
padding:12px;
border-radius:14px;
display:flex;
justify-content:space-between;
cursor:pointer;
font-weight:500;
box-shadow:0 5px 15px rgba(0,0,0,.05);
transition:.2s;
}

.dd-btn:hover{
transform:translateY(-1px);
}

.dd-panel{
position:absolute;
top:55px;
left:0;
right:0;
background:white;
border-radius:14px;
overflow:hidden;
max-height:0;
opacity:0;
transition:.25s ease;
box-shadow:0 10px 25px rgba(0,0,0,.12);
z-index:5;
}

.dd.open .dd-panel{
max-height:250px;
opacity:1;
}

.dd-item{
padding:12px;
cursor:pointer;
transition:.2s;
}

.dd-item:hover{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
}

/* CAMERA */
.camera{
flex:2;
min-width:500px;
}

.camera-box{
position:relative;
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

video{
width:100%;
display:block;
}

/* LIVE */
.live{
position:absolute;
top:10px;
left:10px;
display:flex;
gap:6px;
align-items:center;
font-weight:bold;
}

.dot{
width:10px;height:10px;
background:red;
border-radius:50%;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.6);opacity:.4}
}

/* STICKER LAYER */
#layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

.sticker{
position:absolute;
font-size:30px;
cursor:grab;
pointer-events:auto;
user-select:none;
}

/* BUTTONS */
.controls{
display:flex;
gap:10px;
justify-content:center;
margin-top:12px;
flex-wrap:wrap;
}

button{
padding:10px 16px;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:bold;
}

.start{background:#ff5c8a;color:white}
.stop{background:#ff3b3b;color:white}
.reset{background:#7b61ff;color:white}

/* COUNTDOWN */
#countdown{
text-align:center;
font-size:55px;
height:60px;
color:#ff4d6d;
}

</style>
</head>

<body>

<nav>
<div class="logo">📸 Photobooth With Me</div>
</nav>

<div class="main">

<!-- SETTINGS -->
<div class="sidebar">

<div class="dd" id="photoDD">
<div class="dd-btn" onclick="toggle('photoDD')">Photos ▾</div>
<div class="dd-panel">
<div class="dd-item" onclick="setPhotos(2)">2 Photos</div>
<div class="dd-item" onclick="setPhotos(4)">4 Photos</div>
<div class="dd-item" onclick="setPhotos(6)">6 Photos</div>
</div>
</div>

<div class="dd" id="filterDD">
<div class="dd-btn" onclick="toggle('filterDD')">Filter ▾</div>
<div class="dd-panel">
<div class="dd-item" onclick="setFilter('none')">Normal</div>
<div class="dd-item" onclick="setFilter('grayscale(1)')">B&W</div>
<div class="dd-item" onclick="setFilter('sepia(1)')">Vintage</div>
</div>
</div>

<div class="dd" id="stickerDD">
<div class="dd-btn" onclick="toggle('stickerDD')">Sticker ▾</div>
<div class="dd-panel">
<div class="dd-item" onclick="addSticker('💖')">💖 Heart</div>
<div class="dd-item" onclick="addSticker('✨')">✨ Sparkle</div>
<div class="dd-item" onclick="addSticker('🎀')">🎀 Ribbon</div>
<div class="dd-item" onclick="addSticker('🐻')">🐻 Bear</div>
</div>
</div>

</div>

<!-- CAMERA -->
<div class="camera">

<div class="camera-box">

<div class="live">
<div class="dot"></div> LIVE
</div>

<video id="video" autoplay playsinline></video>

<div id="layer"></div>

</div>

<div id="countdown"></div>

<div class="controls">
<button class="start" id="startBtn">Start</button>
<button class="stop" id="stopBtn">Stop</button>
<button class="reset" id="resetBtn">Reset</button>
</div>

</div>

</div>

<script>

const video=document.getElementById('video');
const layer=document.getElementById('layer');

let running=false;
let photoCount=4;
let stickers=[];

/* camera */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* dropdown */
function toggle(id){
document.getElementById(id).classList.toggle('open');
}

/* settings */
function setPhotos(n){photoCount=n;}
function setFilter(f){video.style.filter=f;}

/* sticker */
function addSticker(icon){

const s=document.createElement('div');
s.className='sticker';
s.innerText=icon;
s.style.left="120px";
s.style.top="120px";

layer.appendChild(s);
stickers.push(s);

let drag=false;

s.onmousedown=()=>drag=true;
document.onmouseup=()=>drag=false;

document.onmousemove=(e)=>{
if(drag){
s.style.left=e.pageX+'px';
s.style.top=e.pageY+'px';
}
};
}

/* capture */
function capture(){
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext('2d');
ctx.filter=getComputedStyle(video).filter;
ctx.drawImage(video,0,0);

stickers.forEach(st=>{
ctx.font="40px Arial";
ctx.fillText(st.innerText,
parseInt(st.style.left),
parseInt(st.style.top));
});
}

/* start */
document.getElementById('startBtn').onclick=async()=>{

running=true;
layer.innerHTML='';
stickers=[];

for(let i=0;i<photoCount;i++){

if(!running) break;

for(let c=3;c>0;c--){
document.getElementById('countdown').innerText=c;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();

await new Promise(r=>setTimeout(r,500));
}

document.getElementById('countdown').innerText="";
};

/* stop */
document.getElementById('stopBtn').onclick=()=>{
running=false;
document.getElementById('countdown').innerText="";
};

/* reset */
document.getElementById('resetBtn').onclick=()=>{
running=false;
layer.innerHTML='';
stickers=[];
document.getElementById('countdown').innerText="";
};

</script>

</body>
</html>
