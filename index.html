<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me v5.1</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
min-height:100vh;
}

/* NAV (keep simple) */
nav{
display:flex;
justify-content:space-between;
padding:15px 30px;
background:rgba(255,255,255,.8);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:10;
}

.logo{font-weight:bold}

/* MAIN */
.main{
display:flex;
gap:20px;
max-width:1200px;
margin:auto;
padding:20px;
flex-wrap:wrap;
}

/* SIDEBAR */
.sidebar{
flex:1;
min-width:260px;
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:20px;
padding:18px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

/* CUSTOM DROPDOWN */
.dd{
margin-bottom:15px;
position:relative;
}

.dd-btn{
padding:12px;
background:white;
border-radius:14px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 15px rgba(0,0,0,.05);
font-weight:500;
}

.dd-panel{
position:absolute;
top:55px;
left:0;
right:0;
background:white;
border-radius:14px;
overflow:hidden;
max-height:0;
opacity:0;
transition:.3s ease;
box-shadow:0 10px 25px rgba(0,0,0,.12);
z-index:5;
}

.dd.open .dd-panel{
max-height:220px;
opacity:1;
}

.dd-item{
padding:12px;
cursor:pointer;
transition:.2s;
}

.dd-item:hover{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
}

/* CAMERA */
.camera{
flex:2;
min-width:500px;
}

.camera-box{
position:relative;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

video{
width:100%;
display:block;
}

/* LIVE */
.live{
position:absolute;
top:10px;
left:10px;
display:flex;
gap:6px;
align-items:center;
}

.dot{
width:10px;
height:10px;
background:red;
border-radius:50%;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.6);opacity:.4}
}

/* STICKER PREVIEW */
.sticker{
position:absolute;
font-size:30px;
cursor:grab;
user-select:none;
}

/* CONTROLS */
.controls{
display:flex;
gap:10px;
justify-content:center;
margin-top:12px;
}

button{
padding:10px 16px;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:bold;
}

.start{background:#ff5c8a;color:white}
.stop{background:#ff3b3b;color:white}
.reset{background:#7b61ff;color:white}

/* COUNTDOWN */
#countdown{
text-align:center;
font-size:50px;
height:60px;
color:#ff4d6d;
}

</style>
</head>

<body>

<nav>
<div class="logo">📸 Korean Photobooth</div>
</nav>

<div class="main">

<!-- SETTINGS -->
<div class="sidebar">

<!-- PHOTOS -->
<div class="dd" id="dd-photo">
<div class="dd-btn" onclick="toggle('dd-photo')">
Photos <span>▾</span>
</div>
<div class="dd-panel">
<div class="dd-item" onclick="setValue('photo',2)">2 Photos</div>
<div class="dd-item" onclick="setValue('photo',4)">4 Photos</div>
<div class="dd-item" onclick="setValue('photo',6)">6 Photos</div>
</div>
</div>

<!-- FRAME -->
<div class="dd" id="dd-frame">
<div class="dd-btn" onclick="toggle('dd-frame')">
Frame Style <span>▾</span>
</div>
<div class="dd-panel">
<div class="dd-item">Korean Pink</div>
<div class="dd-item">Soft White</div>
<div class="dd-item">Neon Glow</div>
</div>
</div>

<!-- FILTER -->
<div class="dd" id="dd-filter">
<div class="dd-btn" onclick="toggle('dd-filter')">
Filter <span>▾</span>
</div>
<div class="dd-panel">
<div class="dd-item" onclick="setFilter('none')">Normal</div>
<div class="dd-item" onclick="setFilter('grayscale(1)')">B&W</div>
<div class="dd-item" onclick="setFilter('sepia(1)')">Vintage</div>
</div>
</div>

<!-- STICKER -->
<div class="dd" id="dd-sticker">
<div class="dd-btn" onclick="toggle('dd-sticker')">
Sticker 🎀 <span>▾</span>
</div>
<div class="dd-panel">
<div class="dd-item" onclick="setSticker('💖')">💖 Heart</div>
<div class="dd-item" onclick="setSticker('✨')">✨ Sparkle</div>
<div class="dd-item" onclick="setSticker('🎀')">🎀 Ribbon</div>
<div class="dd-item" onclick="setSticker('🐻')">🐻 Bear</div>
</div>
</div>

</div>

<!-- CAMERA -->
<div class="camera">

<div class="camera-box">
<div class="live"><div class="dot"></div> LIVE</div>

<video id="video" autoplay playsinline></video>

<div id="stickerLayer"></div>

</div>

<div id="countdown"></div>

<div class="controls">
<button class="start" id="startBtn">Start</button>
<button class="stop" id="stopBtn">Stop</button>
<button class="reset" id="resetBtn">Reset</button>
</div>

</div>

</div>

<script>

const video=document.getElementById('video');
const layer=document.getElementById('stickerLayer');

let running=false;
let photos=[];
let selectedSticker=null;
let stickers=[];

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* dropdown */
function toggle(id){
document.getElementById(id).classList.toggle('open');
}

/* settings */
function setValue(type,val){
if(type==='photo') window.photoCount=val;
}

function setFilter(f){
video.style.filter=f;
}

function setSticker(s){
selectedSticker=s;
createStickerPreview(s);
}

/* sticker preview (before capture) */
function createStickerPreview(s){
const el=document.createElement('div');
el.innerText=s;
el.className='sticker';
el.style.left="120px";
el.style.top="120px";

makeDraggable(el);
layer.appendChild(el);
stickers.push(el);
}

/* drag */
function makeDraggable(el){
let drag=false;

el.onmousedown=()=>drag=true;
document.onmouseup=()=>drag=false;

document.onmousemove=(e)=>{
if(drag){
el.style.left=e.pageX+'px';
el.style.top=e.pageY+'px';
}
};
}

/* capture */
function capture(){
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext('2d');
ctx.drawImage(video,0,0);

// draw stickers
stickers.forEach(st=>{
ctx.font="40px Arial";
ctx.fillText(st.innerText,parseInt(st.style.left),parseInt(st.style.top));
});

photos.push(canvas.toDataURL());
}

/* start */
document.getElementById('startBtn').onclick=async()=>{
running=true;
photos=[];
layer.innerHTML='';
stickers=[];

let count=window.photoCount||4;

for(let i=0;i<count;i++){
if(!running) break;

for(let c=3;c>0;c--){
document.getElementById('countdown').innerText=c;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();
await new Promise(r=>setTimeout(r,500));
}

document.getElementById('countdown').innerText="";
};

/* stop */
document.getElementById('stopBtn').onclick=()=>{
running=false;
document.getElementById('countdown').innerText="";
};

/* reset */
document.getElementById('resetBtn').onclick=()=>{
running=false;
photos=[];
layer.innerHTML='';
stickers=[];
document.getElementById('countdown').innerText="";
};

</script>

</body>
</html>
