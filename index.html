<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
min-height:100vh;
color:#333;
}

/* ===== TOP NAV (NEW MODERN MENU) ===== */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 40px;
background:rgba(255,255,255,.7);
backdrop-filter:blur(14px);
border-bottom:1px solid rgba(255,255,255,.4);
}

.logo{
font-size:18px;
font-weight:700;
}

/* MENU WRAP */
.menu{
display:flex;
gap:10px;
}

/* MENU ITEM */
.menu-item{
position:relative;
}

.menu-btn{
padding:10px 14px;
border-radius:14px;
cursor:pointer;
font-weight:600;
transition:.2s;
user-select:none;
}

.menu-btn:hover{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
transform:translateY(-1px);
}

/* DROPDOWN PANEL */
.dropdown{
position:absolute;
top:45px;
left:0;
min-width:210px;
background:white;
border-radius:16px;
box-shadow:0 15px 35px rgba(0,0,0,.15);
overflow:hidden;

max-height:0;
opacity:0;
transform:translateY(10px);
transition:.25s ease;
}

.menu-item:hover .dropdown{
max-height:300px;
opacity:1;
transform:translateY(0);
}

/* DROPDOWN ITEM */
.dropdown div{
padding:12px 14px;
cursor:pointer;
transition:.2s;
}

.dropdown div:hover{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
}

/* ===== MAIN LAYOUT ===== */
.main{
display:flex;
gap:20px;
max-width:1200px;
margin:auto;
padding:20px;
flex-wrap:wrap;
}

/* ===== SETTINGS PANEL ===== */
.sidebar{
flex:1;
min-width:260px;
background:rgba(255,255,255,.65);
backdrop-filter:blur(14px);
border-radius:22px;
padding:18px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

/* CARD */
.card{
background:white;
border-radius:16px;
padding:12px;
margin-bottom:12px;
box-shadow:0 5px 15px rgba(0,0,0,.06);
}

/* CUSTOM SELECT STYLE */
select{
width:100%;
padding:10px;
border-radius:12px;
border:1px solid #eee;
outline:none;
}

/* ===== CAMERA ===== */
.camera{
flex:2;
min-width:500px;
}

.camera-box{
position:relative;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

video{
width:100%;
display:block;
}

/* LIVE */
.live{
position:absolute;
top:10px;
left:10px;
display:flex;
align-items:center;
gap:6px;
font-weight:bold;
}

.dot{
width:10px;
height:10px;
background:red;
border-radius:50%;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.6);opacity:.4}
}

/* STICKER LAYER */
#layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

.sticker{
position:absolute;
font-size:32px;
pointer-events:auto;
cursor:grab;
user-select:none;
}

/* BUTTONS */
.controls{
display:flex;
gap:10px;
justify-content:center;
margin-top:12px;
flex-wrap:wrap;
}

button{
padding:10px 16px;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:bold;
}

.start{background:#ff5c8a;color:white}
.stop{background:#ff3b3b;color:white}
.reset{background:#7b61ff;color:white}

/* COUNTDOWN */
#countdown{
text-align:center;
font-size:55px;
height:60px;
color:#ff4d6d;
}

</style>
</head>

<body>

<!-- ===== NEW MENU ===== -->
<nav>

<div class="logo">📸 Photobooth With Me</div>

<div class="menu">

<!-- TREND -->
<div class="menu-item">
<div class="menu-btn">Trend ✨</div>
<div class="dropdown">
<div>Pink Korean</div>
<div>Neon Glow</div>
<div>Retro Film</div>
<div>Soft Pastel</div>
</div>
</div>

<!-- FRAMES -->
<div class="menu-item">
<div class="menu-btn">Frames 🖼</div>
<div class="dropdown">
<div>Classic Strip</div>
<div>Korean Booth</div>
<div>Birthday Cute</div>
<div>Minimal White</div>
</div>
</div>

<!-- FILTERS -->
<div class="menu-item">
<div class="menu-btn">Filters 🎨</div>
<div class="dropdown">
<div>Soft Pink</div>
<div>Vintage</div>
<div>Black & White</div>
<div>Warm Glow</div>
</div>
</div>

<!-- GALLERY -->
<div class="menu-item">
<div class="menu-btn">Gallery 📷</div>
<div class="dropdown">
<div>My Photos</div>
<div>Saved Strips</div>
<div>Trending</div>
</div>
</div>

</div>
</nav>

<!-- ===== MAIN ===== -->
<div class="main">

<!-- SETTINGS -->
<div class="sidebar">

<div class="card">
<label>Photos</label>
<select id="photoCount">
<option value="2">2 Photos</option>
<option value="4" selected>4 Photos</option>
<option value="6">6 Photos</option>
</select>
</div>

<div class="card">
<label>Filter</label>
<select id="filter">
<option value="none">Normal</option>
<option value="grayscale(1)">B&W</option>
<option value="sepia(1)">Vintage</option>
</select>
</div>

<div class="card">
<label>Sticker</label>
<select id="stickerSelect">
<option value="💖">💖 Heart</option>
<option value="✨">✨ Sparkle</option>
<option value="🎀">🎀 Ribbon</option>
<option value="🐻">🐻 Bear</option>
</select>
<button onclick="addStickerFromSelect()" style="margin-top:10px;width:100%">Add Sticker</button>
</div>

</div>

<!-- CAMERA -->
<div class="camera">

<div class="camera-box">

<div class="live">
<div class="dot"></div> LIVE
</div>

<video id="video" autoplay playsinline></video>

<div id="layer"></div>

</div>

<div id="countdown"></div>

<div class="controls">
<button class="start" id="startBtn">Start</button>
<button class="stop" id="stopBtn">Stop</button>
<button class="reset" id="resetBtn">Reset</button>
</div>

</div>

</div>

<script>

const video=document.getElementById('video');
const layer=document.getElementById('layer');

let running=false;
let photoCount=4;
let stickers=[];

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>video.srcObject=stream);

/* SETTINGS */
document.getElementById('photoCount').onchange=(e)=>{
photoCount=parseInt(e.target.value);
};

document.getElementById('filter').onchange=(e)=>{
video.style.filter=e.target.value;
};

/* STICKER */
function addStickerFromSelect(){
const value=document.getElementById('stickerSelect').value;

const s=document.createElement('div');
s.className='sticker';
s.innerText=value;
s.style.left="120px";
s.style.top="120px";

layer.appendChild(s);
stickers.push(s);

/* drag */
let drag=false;

s.onmousedown=()=>drag=true;
document.onmouseup=()=>drag=false;

document.onmousemove=(e)=>{
if(drag){
s.style.left=e.pageX+'px';
s.style.top=e.pageY+'px';
}
};
}

/* CAPTURE */
function capture(){
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext('2d');
ctx.filter=getComputedStyle(video).filter;
ctx.drawImage(video,0,0);

stickers.forEach(st=>{
ctx.font="40px Arial";
ctx.fillText(st.innerText,
parseInt(st.style.left),
parseInt(st.style.top));
});
}

/* START */
document.getElementById('startBtn').onclick=async()=>{

running=true;
layer.innerHTML='';
stickers=[];

for(let i=0;i<photoCount;i++){

if(!running) break;

for(let c=3;c>0;c--){
document.getElementById('countdown').innerText=c;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();

await new Promise(r=>setTimeout(r,500));
}

document.getElementById('countdown').innerText="";
};

/* STOP */
document.getElementById('stopBtn').onclick=()=>{
running=false;
document.getElementById('countdown').innerText="";
};

/* RESET */
document.getElementById('resetBtn').onclick=()=>{
running=false;
layer.innerHTML='';
stickers=[];
document.getElementById('countdown').innerText="";
};

</script>

</body>
</html>
