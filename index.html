<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me v5</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f5e8ff,#e6f7ff);
min-height:100vh;
overflow-x:hidden;
}

/* NAV */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 35px;
background:rgba(255,255,255,.85);
backdrop-filter:blur(12px);
box-shadow:0 2px 20px rgba(0,0,0,.08);
}

.logo{font-weight:bold;font-size:20px}

nav ul{display:flex;gap:15px;list-style:none}

nav li{position:relative}

nav a{
text-decoration:none;
color:#333;
padding:8px 12px;
border-radius:10px;
font-weight:600;
transition:.2s;
}

nav a:hover{
background:#ff5c8a;
color:white;
}

/* dropdown */
.dropdown{
position:absolute;
top:40px;
left:0;
min-width:200px;
background:white;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
opacity:0;
visibility:hidden;
transform:translateY(10px);
transition:.2s;
overflow:hidden;
}

nav li:hover .dropdown{
opacity:1;
visibility:visible;
transform:translateY(0);
}

.dropdown a{
display:block;
padding:12px;
}

.dropdown a:hover{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
}

/* HERO */
.hero{
text-align:center;
padding:40px 20px;
}

.hero h1{font-size:42px}
.hero p{color:#666}

/* MAIN */
.main{
display:flex;
gap:20px;
max-width:1200px;
margin:auto;
padding:20px;
flex-wrap:wrap;
}

/* SETTINGS */
.sidebar{
flex:1;
min-width:260px;
background:rgba(255,255,255,.7);
backdrop-filter:blur(10px);
padding:20px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.box{
background:white;
padding:12px;
border-radius:15px;
margin-bottom:12px;
box-shadow:0 5px 15px rgba(0,0,0,.05);
}

select{
width:100%;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
}

/* CAMERA */
.camera-section{flex:2;min-width:500px}

.camera-card{
position:relative;
background:white;
padding:15px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
overflow:hidden;
}

/* LIVE */
.live{
position:absolute;
top:10px;
left:10px;
display:flex;
align-items:center;
gap:6px;
font-weight:bold;
}

.dot{
width:10px;height:10px;
background:red;
border-radius:50%;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.5);opacity:.4}
}

/* camera spark */
.spark{
position:absolute;
width:100%;
height:100%;
pointer-events:none;
}

/* VIDEO */
video{
width:100%;
border-radius:15px;
filter:contrast(1.05);
}

/* BUTTONS */
.buttons{
display:flex;
gap:10px;
justify-content:center;
margin-top:15px;
flex-wrap:wrap;
}

button{
padding:12px 18px;
border:none;
border-radius:30px;
font-weight:bold;
cursor:pointer;
}

.primary{background:#ff5c8a;color:white}
.secondary{background:#7b61ff;color:white}
.stop{background:#ff3b3b;color:white}

/* COUNT */
#countdown{
text-align:center;
font-size:60px;
height:70px;
color:#ff4d6d;
}

/* PHOTOS */
#photos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px;
margin-top:15px;
}

#photos img{
width:100%;
border-radius:12px;
}

/* STICKERS */
.sticker{
position:absolute;
font-size:30px;
cursor:grab;
user-select:none;
}

/* FLASH */
.flash{animation:flash .2s}
@keyframes flash{
0%{opacity:1}
50%{opacity:.2}
}

/* MOBILE */
@media(max-width:800px){
.camera-section{min-width:100%}
.hero h1{font-size:32px}
}
</style>
</head>

<body>

<nav>
<div class="logo">📸 Photobooth v5</div>
<ul>
<li>
<a href="#">Trend</a>
<div class="dropdown">
<a>Pink K-style</a>
<a>Neon Glow</a>
<a>Retro Film</a>
</div>
</li>
<li>
<a href="#">Filters</a>
<div class="dropdown">
<a>Soft Pink</a>
<a>Vintage</a>
<a>Black White</a>
</div>
</li>
</ul>
</nav>

<section class="hero">
<h1>AI Photobooth Studio</h1>
<p>Make aesthetic photostrips like Korean booths</p>
</section>

<div class="main">

<div class="sidebar">

<div class="box">
<label>Photo Count</label>
<select id="count">
<option value="2">2</option>
<option value="4" selected>4</option>
<option value="6">6</option>
</select>
</div>

<div class="box">
<label>Filter</label>
<select id="filter">
<option value="none">Normal</option>
<option value="grayscale(1)">B&W</option>
<option value="sepia(1)">Vintage</option>
</select>
</div>

<div class="box">
<button onclick="addSticker('💖')">💖 Sticker</button>
<button onclick="addSticker('✨')">✨ Sparkle</button>
<button onclick="addSticker('🎀')">🎀 Cute</button>
</div>

</div>

<div class="camera-section">

<div class="camera-card">

<div class="live">
<div class="dot"></div> LIVE
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none"></canvas>

<div id="countdown"></div>

<div class="buttons">
<button class="primary" id="start">Start</button>
<button class="stop" id="stop">Stop</button>
<button class="secondary" id="retake">Reset</button>
<button class="secondary" onclick="playSound()">🔊</button>
</div>

</div>

<div id="photos"></div>

</div>

</div>

<script>

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

let photos=[];
let running=false;

/* SOUND */
function playSound(){
const audio=new Audio("https://www.myinstants.com/media/sounds/camera-shutter-click.mp3");
audio.play();
}

/* CAMERA */
async function startCam(){
const stream=await navigator.mediaDevices.getUserMedia({video:true});
video.srcObject=stream;
}

startCam();

/* FILTER */
document.getElementById('filter').onchange=(e)=>{
video.style.filter=e.target.value;
};

/* CAPTURE */
function capture(){
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
ctx.drawImage(video,0,0);

playSound();

const img=canvas.toDataURL();
photos.push(img);

const im=document.createElement('img');
im.src=img;
document.getElementById('photos').appendChild(im);

video.classList.add('flash');
setTimeout(()=>video.classList.remove('flash'),200);
}

/* START */
document.getElementById('start').onclick=async()=>{
running=true;
photos=[];
document.getElementById('photos').innerHTML='';

let count=parseInt(document.getElementById('count').value);

for(let i=0;i<count;i++){
if(!running) break;

for(let c=3;c>0;c--){
document.getElementById('countdown').innerText=c;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();
await new Promise(r=>setTimeout(r,500));
}

document.getElementById('countdown').innerText="";
createStrip();
};

/* STOP */
document.getElementById('stop').onclick=()=>{
running=false;
document.getElementById('countdown').innerText="";
};

/* RESET */
document.getElementById('retake').onclick=()=>{
running=false;
photos=[];
document.getElementById('photos').innerHTML='';
};

/* STICKER */
function addSticker(icon){
const s=document.createElement('div');
s.className='sticker';
s.innerText=icon;
s.style.left="100px";
s.style.top="100px";

document.body.appendChild(s);

let drag=false;

s.onmousedown=()=>drag=true;
document.onmouseup=()=>drag=false;
document.onmousemove=(e)=>{
if(drag){
s.style.left=e.pageX+'px';
s.style.top=e.pageY+'px';
}
};
}

/* STRIP */
function createStrip(){
const strip=document.createElement('canvas');
strip.width=400;
strip.height=photos.length*250+100;

const c=strip.getContext('2d');

c.fillStyle="white";
c.fillRect(0,0,strip.width,strip.height);

let y=20;

photos.forEach(src=>{
const img=new Image();
img.onload=()=>{
c.drawImage(img,25,y,350,200);
y+=220;

if(y>strip.height-100){
c.fillStyle="#333";
c.font="16px Arial";
c.textAlign="center";
c.fillText("Photobooth v5",200,strip.height-30);

const url=strip.toDataURL();
const a=document.createElement('a');
a.href=url;
a.download="photostrip.png";
a.click();
}
};
img.src=src;
});
}

</script>

</body>
</html>
