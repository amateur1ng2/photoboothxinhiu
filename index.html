<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me - FIXED</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f5e8ff,#e6f7ff);
min-height:100vh;
color:#333;
}

/* NAV */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
}

nav > ul{
display:flex;
gap:20px;
list-style:none;
}

.menu-item{position:relative}

.menu-item>a{
padding:10px 14px;
border-radius:20px;
color:white !important;
text-decoration:none;
display:block;
font-weight:bold;
}

.trends>a{background:#ff5c8a;}
.styles>a{background:#9b5cff;}
.pose>a{background:#4f8cff;}
.events>a{background:#ffb347;}
.gallerym>a{background:#33c48d;}

/* DROPDOWN */
.dropdown{
position:absolute;
top:45px;
left:0;
min-width:200px;
background:white;
border-radius:12px;
list-style:none;
padding:8px 0;
box-shadow:0 10px 25px rgba(0,0,0,.15);
opacity:0;
visibility:hidden;
transition:.2s;
z-index:9999;
display:block;
}

.menu-item:hover .dropdown{
opacity:1;
visibility:visible;
}

.dropdown li{display:block}
.dropdown a{
display:block;
padding:10px;
color:#333 !important;
text-decoration:none;
}
.dropdown a:hover{background:#f2f2f2}

/* CAMERA */
.camera-card{
max-width:500px;
margin:20px auto;
position:relative;
border-radius:20px;
overflow:hidden;
background:#000;
}

.photobooth-bg{
position:absolute;
inset:0;
z-index:0;
pointer-events:none;
background:linear-gradient(135deg,#ffe4ec,#f8dfff,#dff7ff);
}

video{
width:100%;
display:block;
position:relative;
z-index:2;
border-radius:20px;
transform:scaleX(-1);
}

.live-badge{
position:absolute;
top:10px;
left:10px;
z-index:10;
background:red;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

/* CONTROLS */
#countdown{
font-size:60px;
text-align:center;
height:80px;
color:#ff4d6d;
}

.buttons{
display:flex;
justify-content:center;
gap:10px;
margin-top:15px;
}

button{
padding:12px 18px;
border:none;
border-radius:30px;
cursor:pointer;
font-weight:bold;
touch-action:manipulation;
}

.primary{background:#ff5c8a;color:#fff;}
.secondary{background:#7b61ff;color:#fff;}
.dark-btn{background:#222;color:#fff;}

/* PHOTOS */
#photos img{
width:80px;
margin:5px;
border-radius:10px;
}

.gallery img{
width:120px;
margin:5px;
border-radius:10px;
}
</style>
</head>

<body>

<nav>
<div class="logo">📸 Photobooth</div>

<ul>
<li class="menu-item trends"><a href="#">Trends</a></li>
<li class="menu-item styles"><a href="#">Styles</a></li>
<li class="menu-item pose"><a href="#">Pose</a></li>
<li class="menu-item events"><a href="#">Events</a></li>
<li class="menu-item gallerym"><a href="#">Gallery</a></li>
</ul>
</nav>

<div class="camera-card">

<div class="photobooth-bg"></div>
<div class="live-badge">🔴 LIVE</div>

<video id="video" autoplay playsinline muted></video>
</div>

<div id="countdown"></div>

<div class="buttons">
<button class="primary" id="startBtn">Start</button>
<button class="secondary" id="retakeBtn">Retake</button>
<button class="secondary" id="downloadBtn" style="display:none">Download</button>
</div>

<div id="photos"></div>

<h3 style="text-align:center">Gallery</h3>
<div class="gallery" id="gallery"></div>

<canvas id="canvas" style="display:none"></canvas>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const countdown=document.getElementById("countdown");
const photosDiv=document.getElementById("photos");
const gallery=document.getElementById("gallery");
const downloadBtn=document.getElementById("downloadBtn");

let photos=[];
let cameraStarted=false;

async function startCamera(){
if(cameraStarted) return true;

try{

const stream = await navigator.mediaDevices.getUserMedia({
video:{ facingMode:"user" },
audio:false
});

video.srcObject = stream;

video.setAttribute("playsinline",true);
video.muted = true;

await new Promise(r=>video.onloadedmetadata=r);
await video.play().catch(()=>{});

cameraStarted=true;
return true;

}catch(e){
console.error(e);
alert("Camera permission required");
return false;
}
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));

function capture(){
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext("2d");
ctx.drawImage(video,0,0);

const img=canvas.toDataURL("image/png");

photos.push(img);

const el=document.createElement("img");
el.src=img;
photosDiv.appendChild(el);
}

document.getElementById("startBtn").addEventListener("click", async (e)=>{

e.preventDefault();

const ok=await startCamera();
if(!ok) return;

photos=[];
photosDiv.innerHTML="";

let count=4;

for(let i=0;i<count;i++){

for(let c=3;c>0;c--){
countdown.textContent=c;
await sleep(1000);
}

countdown.textContent="📸";
capture();
await sleep(500);
}

countdown.textContent="";

const url=canvas.toDataURL();

downloadBtn.style.display="inline-block";

downloadBtn.onclick=()=>{
const a=document.createElement("a");
a.href=url;
a.download="photobooth.png";
a.click();
};

const g=document.createElement("img");
g.src=url;
gallery.prepend(g);
});

document.getElementById("retakeBtn").onclick=()=>{
photos=[];
photosDiv.innerHTML="";
countdown.textContent="";
downloadBtn.style.display="none";
};
</script>

</body>
</html>
