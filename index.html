<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f5e8ff,#e6f7ff);
min-height:100vh;
color:#333;
transition:.3s;
overflow-x:hidden;
}

/* DARK MODE */
.dark{
background:#111;
color:#fff;
}
.dark nav,
.dark .sidebar,
.dark .camera-card{
background:#222 !important;
color:#fff;
}
.dark footer{background:#222}

/* NAV */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
box-shadow:0 2px 20px rgba(0,0,0,.08);
}

nav ul{
display:flex;
gap:20px;
list-style:none;
}

nav a{
text-decoration:none;
color:inherit;
font-weight:600;
}

/* HERO */
.hero{
text-align:center;
padding:50px 20px;
}

/* MAIN */
.main{
display:flex;
gap:25px;
max-width:1200px;
margin:auto;
padding:20px;
flex-wrap:wrap;
}

.sidebar{
flex:1;
min-width:260px;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.camera-section{
flex:2;
min-width:500px;
}

.camera-card{
background:white;
padding:15px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
position:relative;
overflow:hidden;
}

.live-badge{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
padding:4px 10px;
border-radius:20px;
font-size:12px;
z-index:2;
}

/* VIDEO + ZOOM */
video{
width:100%;
border-radius:15px;
transform:scale(1);
transition:.2s;
}

/* STICKERS LAYER */
#layer{
position:absolute;
inset:0;
}

.sticker{
position:absolute;
font-size:32px;
cursor:grab;
user-select:none;
transform-origin:center;
}

.sticker img{
width:60px;
pointer-events:none;
}

/* BUTTONS */
button{
border:none;
padding:10px 14px;
border-radius:30px;
cursor:pointer;
font-weight:bold;
}

.primary{background:#ff5c8a;color:#fff}
.secondary{background:#7b61ff;color:#fff}
.dark-btn{background:#222;color:#fff}

/* CONTROLS */
.buttons{
display:flex;
gap:8px;
flex-wrap:wrap;
justify-content:center;
margin-top:15px;
}

/* COUNTDOWN */
#countdown{
font-size:60px;
text-align:center;
height:70px;
color:#ff4d6d;
}

/* PHOTOS */
#photos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
margin-top:10px;
}

.photo-item{
position:relative;
}

.photo-item img{
width:100%;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.del{
position:absolute;
top:5px;
right:5px;
background:red;
color:white;
border:none;
width:22px;
height:22px;
border-radius:50%;
cursor:pointer;
}

/* FRAME BOX */
#frameBox{
margin-top:10px;
display:none;
}

.frame-item{
padding:8px;
margin:6px 0;
border-radius:10px;
cursor:pointer;
background:#f3f3f3;
}

.frame-item.active{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
}

/* ZOOM UI */
.zoom-controls{
position:absolute;
bottom:10px;
left:10px;
display:flex;
gap:6px;
z-index:2;
}

.zoom-controls button{
padding:6px 10px;
border-radius:8px;
background:white;
}

/* FLASH */
.flash{
animation:flash .2s;
}
@keyframes flash{
0%{opacity:1}
50%{opacity:.2}
100%{opacity:1}
}

/* FILTER EFFECTS */
.grayscale{filter:grayscale(100%)}
.sepia{filter:sepia(100%)}
.warm{filter:contrast(120%) saturate(120%)}

footer{
text-align:center;
padding:20px;
background:rgba(255,255,255,.8);
margin-top:30px;
}

</style>
</head>

<body>

<nav>
<div><b>📸 Photobooth With Me</b></div>
<ul>
<li><a href="#home">Home</a></li>
<li><a href="#gallery">Gallery</a></li>
</ul>
</nav>

<section class="hero">
<h1>Photobooth With Me</h1>
<p>Create Korean-style photostrips</p>
</section>

<div class="main">

<!-- SIDEBAR -->
<div class="sidebar">

<label>Photos</label>
<select id="photoCount">
<option value="2">2 Photos</option>
<option value="4" selected>4 Photos</option>
<option value="6">6 Photos</option>
</select>

<label>Filter</label>
<select id="filter">
<option value="none">Normal</option>
<option value="grayscale">B&W</option>
<option value="sepia">Vintage</option>
<option value="warm">Warm</option>
</select>

<button class="primary" id="startBtn">Start</button>
<button class="secondary" id="retakeBtn">Retake</button>
<button class="dark-btn" id="darkModeBtn">Dark Mode</button>

<div id="frameBox">
<h4>Frames</h4>
<div id="frameList"></div>
</div>

<hr>

<!-- STICKERS FULL RESTORED -->
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
<button onclick="addSticker('💖')">💖</button>
<button onclick="addSticker('✨')">✨</button>
<button onclick="addSticker('🎀')">🎀</button>
<button onclick="addSticker('🐱')">🐱</button>
<button onclick="addStickerImg('https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif')">GIF</button>
<button onclick="addStickerImg('https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif')">GIF</button>
</div>

</div>

<!-- CAMERA -->
<div class="camera-section">

<div class="camera-card">

<div class="live-badge">🔴 LIVE</div>

<video id="video" autoplay playsinline></video>

<div class="zoom-controls">
<button onclick="zoom(0.1)">+</button>
<button onclick="zoom(-0.1)">-</button>
</div>

<div id="layer"></div>
</div>

<div id="countdown"></div>

<div class="buttons">
<button class="primary" id="startBtn2">Start</button>
<button class="secondary" id="downloadBtn" style="display:none">Download</button>
</div>

<div id="photos"></div>

</div>

</div>

<footer>© 2026 Photobooth With Me</footer>

<canvas id="canvas" style="display:none"></canvas>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const photosDiv=document.getElementById("photos");
const countdown=document.getElementById("countdown");
const layer=document.getElementById("layer");

let photos=[];
let cameraStarted=false;
let zoomLevel=1;
let selectedFrame="4grid";

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* DARK MODE */
document.getElementById("darkModeBtn").onclick=()=>{
document.body.classList.toggle("dark");
};

/* FILTER */
document.getElementById("filter").onchange=(e)=>{
video.className=e.target.value;
};

/* ZOOM */
function zoom(v){
zoomLevel+=v;
if(zoomLevel<1)zoomLevel=1;
if(zoomLevel>2)zoomLevel=2;
video.style.transform=`scale(${zoomLevel})`;
}

/* FRAME SYSTEM RESTORED + REAL */
function buildFrames(n){

const frameBox=document.getElementById("frameBox");
const frameList=document.getElementById("frameList");

frameBox.style.display="block";
frameList.innerHTML="";

let frames=[];

if(n==2)frames=[
{name:"2 Horizontal",type:"2h"},
{name:"2 Vertical",type:"2v"}
];

if(n==4)frames=[
{name:"4 Grid",type:"4grid"},
{name:"1 Large + 3 Small",type:"4mix"}
];

if(n==6)frames=[
{name:"6 Grid",type:"6grid"},
{name:"Vertical Strip",type:"6strip"}
];

frames.forEach(f=>{
const div=document.createElement("div");
div.className="frame-item";
div.innerText=f.name;

div.onclick=()=>{
selectedFrame=f.type;

document.querySelectorAll(".frame-item")
.forEach(e=>e.classList.remove("active"));

div.classList.add("active");
};

frameList.appendChild(div);
});
}

/* STICKERS */
function addSticker(t){
const el=document.createElement("div");
el.className="sticker";
el.innerText=t;
place(el);
}

function addStickerImg(url){
const el=document.createElement("div");
el.className="sticker";
const img=document.createElement("img");
img.src=url;
el.appendChild(img);
place(el);
}

/* DRAG + RESIZE */
function place(el){

el.style.left="120px";
el.style.top="120px";
layer.appendChild(el);

let drag=false,ox=0,oy=0;

el.addEventListener("pointerdown",e=>{
drag=true;
ox=e.clientX-el.offsetLeft;
oy=e.clientY-el.offsetTop;
});

document.addEventListener("pointermove",e=>{
if(!drag)return;
el.style.left=(e.clientX-ox)+"px";
el.style.top=(e.clientY-oy)+"px";
});

document.addEventListener("pointerup",()=>drag=false);

/* resize */
el.addEventListener("wheel",(e)=>{
e.preventDefault();
let s=el.scale||1;
s+=e.deltaY<0?0.1:-0.1;
if(s<0.5)s=0.5;
if(s>2)s=2;
el.scale=s;
el.style.transform=`scale(${s})`;
});
}

/* CAPTURE */
function capture(){

const c=document.createElement("canvas");
c.width=video.videoWidth;
c.height=video.videoHeight;

const ctx=c.getContext("2d");
ctx.drawImage(video,0,0);

ctx.canvas.toBlob(blob=>{
const url=URL.createObjectURL(blob);

photos.push(url);

const div=document.createElement("div");
div.className="photo-item";

const img=document.createElement("img");
img.src=url;

const del=document.createElement("button");
del.className="del";
del.innerText="×";
del.onclick=()=>div.remove();

div.appendChild(img);
div.appendChild(del);
photosDiv.appendChild(div);
});

document.body.classList.add("flash");
setTimeout(()=>document.body.classList.remove("flash"),200);
}

/* START */
async function start(){

photos=[];

const n=parseInt(document.getElementById("photoCount").value);
buildFrames(n);

for(let i=0;i<n;i++){

for(let s=3;s>0;s--){
countdown.innerText=s;
await new Promise(r=>setTimeout(r,1000));
}

countdown.innerText="📸";
capture();
await new Promise(r=>setTimeout(r,500));
}

countdown.innerText="";
}

document.getElementById("startBtn").onclick=start;
document.getElementById("startBtn2").onclick=start;

</script>

</body>
</html>
