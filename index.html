<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
min-height:100vh;
}

/* NAV */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 40px;
background:rgba(255,255,255,.85);
backdrop-filter:blur(12px);
box-shadow:0 2px 20px rgba(0,0,0,.08);
}

.logo{font-weight:bold}

nav ul{
display:flex;
gap:20px;
list-style:none;
}

nav li{position:relative}

nav a{
text-decoration:none;
color:#333;
font-weight:600;
padding:8px 12px;
border-radius:10px;
}

nav a:hover{
background:#ff5c8a;
color:white;
}

.dropdown{
position:absolute;
top:40px;
left:0;
background:white;
min-width:180px;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
opacity:0;
visibility:hidden;
transform:translateY(10px);
transition:.2s;
}

nav li:hover .dropdown{
opacity:1;
visibility:visible;
transform:translateY(0);
}

.dropdown a{
display:block;
padding:10px 12px;
}

.dropdown a:hover{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
}

/* MAIN */
.main{
display:flex;
gap:20px;
max-width:1200px;
margin:auto;
padding:20px;
flex-wrap:wrap;
}

/* SIDEBAR */
.sidebar{
flex:1;
min-width:260px;
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:20px;
padding:18px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

/* CARD STYLE (LIVE = SAME SIZE AS SETTINGS CARD) */
.card{
background:white;
border-radius:16px;
padding:12px;
margin-bottom:12px;
box-shadow:0 5px 15px rgba(0,0,0,.06);
}

/* CAMERA */
.camera{
flex:2;
min-width:500px;
}

.camera-box{
position:relative;
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

video{
width:100%;
display:block;
}

/* 🔴 LIVE NOW SAME SIZE AS CARD */
.live{
position:absolute;
top:10px;
left:10px;
width:140px;
display:flex;
align-items:center;
gap:6px;
font-size:12px;
font-weight:bold;
background:white;
padding:8px 10px;
border-radius:14px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.dot{
width:8px;
height:8px;
background:red;
border-radius:50%;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.6);opacity:.4}
}

/* STICKER */
#layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.sticker{
position:absolute;
font-size:34px;
cursor:grab;
user-select:none;
touch-action:none;
}

/* CONTROLS */
.controls{
display:flex;
gap:10px;
justify-content:center;
margin-top:12px;
}

button{
padding:10px 16px;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:bold;
}

.start{background:#ff5c8a;color:white}
.stop{background:#ff3b3b;color:white}
.reset{background:#7b61ff;color:white}

/* COUNTDOWN */
#countdown{
text-align:center;
font-size:55px;
height:60px;
color:#ff4d6d;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">📸 Photobooth With Me</div>

<ul>
<li><a href="#">Trend</a>
<div class="dropdown">
<a>Pink</a>
<a>Neon</a>
<a>Retro</a>
</div>
</li>

<li><a href="#">Frames</a>
<div class="dropdown">
<a>Korean</a>
<a>Minimal</a>
</div>
</li>

<li><a href="#">Filters</a>
<div class="dropdown">
<a>Soft</a>
<a>Vintage</a>
</div>
</li>
</ul>
</nav>

<div class="main">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="card">
<button onclick="setPhotos(2)">2 Photos</button>
<button onclick="setPhotos(4)">4 Photos</button>
<button onclick="setPhotos(6)">6 Photos</button>
</div>

<div class="card">
<button onclick="addSticker('💖')">💖</button>
<button onclick="addSticker('✨')">✨</button>
<button onclick="addSticker('🎀')">🎀</button>
</div>

</div>

<!-- CAMERA -->
<div class="camera">

<div class="camera-box">

<!-- 🔴 LIVE SMALL CARD STYLE -->
<div class="live">
<div class="dot"></div>
LIVE
</div>

<video id="video" autoplay playsinline></video>
<div id="layer"></div>

</div>

<div id="countdown"></div>

<div class="controls">
<button class="start" id="start">Start</button>
<button class="stop" id="stop">Stop</button>
<button class="reset" id="reset">Reset</button>
</div>

</div>

</div>

<script>

const video=document.getElementById('video');
const layer=document.getElementById('layer');

let running=false;
let photoCount=4;
let stickers=[];

/* camera */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* settings */
function setPhotos(n){photoCount=n}

/* sticker */
function addSticker(icon){

const el=document.createElement('div');
el.className='sticker';
el.innerText=icon;

el.style.left="120px";
el.style.top="120px";

layer.appendChild(el);
stickers.push(el);

let drag=false;
let offsetX=0;
let offsetY=0;

/* drag */
el.addEventListener('pointerdown',(e)=>{
drag=true;
offsetX=e.clientX - el.offsetLeft;
offsetY=e.clientY - el.offsetTop;
el.setPointerCapture(e.pointerId);
});

el.addEventListener('pointermove',(e)=>{
if(!drag) return;
el.style.left=(e.clientX - offsetX)+'px';
el.style.top=(e.clientY - offsetY)+'px';
});

el.addEventListener('pointerup',()=>drag=false);

/* resize */
el.addEventListener('wheel',(e)=>{
e.preventDefault();

let scale=el.dataset.scale?parseFloat(el.dataset.scale):1;

scale += e.deltaY * -0.001;
scale=Math.max(0.5,Math.min(3,scale));

el.dataset.scale=scale;
el.style.transform=`scale(${scale})`;
});
}

/* capture */
function capture(){
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext('2d');
ctx.drawImage(video,0,0);

stickers.forEach(st=>{
const rect=st.getBoundingClientRect();
const cam=document.querySelector('.camera-box').getBoundingClientRect();

ctx.font="40px Arial";
ctx.fillText(
st.innerText,
rect.left-cam.left,
rect.top-cam.top
);
});
}

/* start */
document.getElementById('start').onclick=async()=>{
running=true;
layer.innerHTML='';
stickers=[];

for(let i=0;i<photoCount;i++){
if(!running) break;

for(let c=3;c>0;c--){
document.getElementById('countdown').innerText=c;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();
await new Promise(r=>setTimeout(r,500));
}

document.getElementById('countdown').innerText="";
};

/* stop */
document.getElementById('stop').onclick=()=>{
running=false;
document.getElementById('countdown').innerText="";
};

/* reset */
document.getElementById('reset').onclick=()=>{
running=false;
layer.innerHTML='';
stickers=[];
document.getElementById('countdown').innerText="";
};

</script>

</body>
</html>
