<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
min-height:100vh;
color:#333;
}

/* NAV */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 40px;
background:rgba(255,255,255,.8);
backdrop-filter:blur(12px);
box-shadow:0 2px 20px rgba(0,0,0,.08);
}

.logo{font-weight:bold}

/* MAIN */
.main{
display:flex;
gap:20px;
max-width:1200px;
margin:auto;
padding:20px;
flex-wrap:wrap;
}

/* SIDEBAR */
.sidebar{
flex:1;
min-width:260px;
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:20px;
padding:18px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

/* CAMERA */
.camera{
flex:2;
min-width:500px;
}

.camera-box{
position:relative;
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

video{
width:100%;
display:block;
}

/* 🔴 LIVE SMALLER */
.live{
position:absolute;
top:8px;
left:8px;
display:flex;
align-items:center;
gap:5px;
font-size:11px;
font-weight:bold;
background:rgba(255,255,255,.7);
padding:3px 6px;
border-radius:12px;
backdrop-filter:blur(5px);
}

.dot{
width:7px;
height:7px;
background:red;
border-radius:50%;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.6);opacity:.4}
}

/* STICKER LAYER */
#layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

/* 🧸 STICKER */
.sticker{
position:absolute;
font-size:32px;
cursor:grab;
user-select:none;
pointer-events:auto;
transform-origin:center;
}

/* BUTTONS */
.controls{
display:flex;
gap:10px;
justify-content:center;
margin-top:12px;
flex-wrap:wrap;
}

button{
padding:10px 16px;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:bold;
}

.start{background:#ff5c8a;color:white}
.stop{background:#ff3b3b;color:white}
.reset{background:#7b61ff;color:white}

/* COUNTDOWN */
#countdown{
text-align:center;
font-size:55px;
height:60px;
color:#ff4d6d;
}

</style>
</head>

<body>

<nav>
<div class="logo">📸 Photobooth With Me</div>
</nav>

<div class="main">

<!-- SETTINGS (giữ nguyên đơn giản) -->
<div class="sidebar">

<button onclick="setPhotos(2)">2 Photos</button>
<button onclick="setPhotos(4)">4 Photos</button>
<button onclick="setPhotos(6)">6 Photos</button>

<hr style="margin:10px 0">

<button onclick="setFilter('none')">Normal</button>
<button onclick="setFilter('grayscale(1)')">B&W</button>

<hr style="margin:10px 0">

<button onclick="addSticker('💖')">💖 Sticker</button>
<button onclick="addSticker('✨')">✨ Sticker</button>
<button onclick="addSticker('🎀')">🎀 Sticker</button>

</div>

<!-- CAMERA -->
<div class="camera">

<div class="camera-box">

<div class="live">
<div class="dot"></div> LIVE
</div>

<video id="video" autoplay playsinline></video>

<div id="layer"></div>

</div>

<div id="countdown"></div>

<div class="controls">
<button class="start" id="startBtn">Start</button>
<button class="stop" id="stopBtn">Stop</button>
<button class="reset" id="resetBtn">Reset</button>
</div>

</div>

</div>

<script>

const video=document.getElementById('video');
const layer=document.getElementById('layer');

let running=false;
let photoCount=4;
let stickers=[];

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* SETTINGS */
function setPhotos(n){photoCount=n;}
function setFilter(f){video.style.filter=f;}

/* 🧸 ADD STICKER */
function addSticker(icon){

const el=document.createElement('div');
el.className='sticker';
el.innerText=icon;
el.style.left="120px";
el.style.top="120px";
el.dataset.scale=1;

layer.appendChild(el);
stickers.push(el);

/* DRAG */
let drag=false;
let offsetX=0;
let offsetY=0;

el.onmousedown=(e)=>{
drag=true;
offsetX=e.offsetX;
offsetY=e.offsetY;
};

document.onmouseup=()=>drag=false;

document.onmousemove=(e)=>{
if(drag){
el.style.left=(e.pageX-offsetX)+'px';
el.style.top=(e.pageY-offsetY)+'px';
}
};

/* 🧠 RESIZE (mouse wheel) */
el.onwheel=(e)=>{
e.preventDefault();

let scale=parseFloat(el.dataset.scale);
scale += e.deltaY * -0.001;

scale=Math.min(Math.max(0.5,scale),3);

el.dataset.scale=scale;
el.style.transform=`scale(${scale})`;
};

}

/* CAPTURE */
function capture(){
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext('2d');
ctx.filter=getComputedStyle(video).filter;
ctx.drawImage(video,0,0);

/* draw stickers */
stickers.forEach(st=>{
const rect=st.getBoundingClientRect();
const videoRect=video.getBoundingClientRect();

ctx.font="40px Arial";
ctx.fillText(
st.innerText,
rect.left - videoRect.left,
rect.top - videoRect.top
);
});
}

/* START */
document.getElementById('startBtn').onclick=async()=>{

running=true;
layer.innerHTML='';
stickers=[];

for(let i=0;i<photoCount;i++){

if(!running) break;

for(let c=3;c>0;c--){
document.getElementById('countdown').innerText=c;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();

await new Promise(r=>setTimeout(r,500));
}

document.getElementById('countdown').innerText="";
};

/* STOP */
document.getElementById('stopBtn').onclick=()=>{
running=false;
document.getElementById('countdown').innerText="";
};

/* RESET */
document.getElementById('resetBtn').onclick=()=>{
running=false;
layer.innerHTML='';
stickers=[];
document.getElementById('countdown').innerText="";
};

</script>

</body>
</html>
