<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f5e8ff,#e6f7ff);
min-height:100vh;
color:#333;
overflow-x:hidden;
}

/* ===== NAV (GIỮ NGUYÊN) ===== */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 28px;
background:rgba(255,255,255,.85);
backdrop-filter:blur(12px);
box-shadow:0 2px 18px rgba(0,0,0,.08);
}

nav ul{
display:flex;
gap:18px;
list-style:none;
}

nav a{text-decoration:none;color:inherit;font-weight:600}

/* ===== HERO ===== */
.hero{
text-align:center;
padding:40px 20px;
}

/* ===== MAIN FIXED LAYOUT ===== */
.main{
display:grid;
grid-template-columns:260px minmax(0,1fr) 280px;
gap:18px;
max-width:1200px;
margin:20px auto;
padding:0 12px;
align-items:start;
}

/* ===== SIDEBAR CLEAN ===== */
.sidebar{
background:rgba(255,255,255,.78);
backdrop-filter:blur(14px);
border-radius:18px;
padding:14px;
display:flex;
flex-direction:column;
gap:12px;
box-shadow:0 8px 24px rgba(0,0,0,.06);
}

.sidebar button{
border:none;
padding:10px 12px;
border-radius:12px;
cursor:pointer;
font-weight:600;
transition:.2s;
}

.sidebar button:hover{
transform:translateY(-1px);
}

/* ===== CAMERA ===== */
.camera-section{flex:1}

.camera-card{
background:white;
border-radius:20px;
padding:10px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
position:relative;
overflow:hidden;
aspect-ratio:3/4;
display:flex;
align-items:center;
justify-content:center;
}

.live-badge{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
padding:4px 10px;
border-radius:20px;
font-size:12px;
z-index:2;
}

/* VIDEO */
video{
width:100%;
height:100%;
object-fit:cover;
border-radius:16px;
transition:.2s;
}

/* ===== STICKER LAYER (GIỮ NGUYÊN LOGIC) ===== */
#layer{
position:absolute;
inset:0;
z-index:3;
}

.sticker{
position:absolute;
font-size:32px;
cursor:grab;
user-select:none;
transform-origin:center;
}

.sticker img{
width:60px;
pointer-events:none;
}

/* ===== RIGHT PANEL ===== */
.panel{
background:rgba(255,255,255,.78);
backdrop-filter:blur(14px);
border-radius:18px;
padding:14px;
box-shadow:0 8px 24px rgba(0,0,0,.06);
display:flex;
flex-direction:column;
gap:10px;
}

/* ===== COUNTDOWN ===== */
#countdown{
font-size:58px;
text-align:center;
height:70px;
color:#ff4d6d;
margin-top:8px;
}

/* ===== FRAME BOX ===== */
#frameBox{
display:none;
background:#fff;
padding:10px;
border-radius:14px;
border:1px solid #eee;
}

.frame-item{
padding:10px;
border-radius:10px;
cursor:pointer;
background:#f6f6f6;
margin:6px 0;
transition:.2s;
}

.frame-item:hover{
background:#eee;
}

.frame-item.active{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
}

/* ===== PHOTOS ===== */
#photos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin-top:10px;
}

.photo-item{
position:relative;
}

.photo-item img{
width:100%;
border-radius:10px;
}

.del{
position:absolute;
top:5px;
right:5px;
background:red;
color:white;
border:none;
width:22px;
height:22px;
border-radius:50%;
cursor:pointer;
}

/* ===== BUTTONS ===== */
button{
border:none;
padding:10px 14px;
border-radius:30px;
cursor:pointer;
font-weight:600;
}

.primary{background:#ff5c8a;color:#fff}
.secondary{background:#7b61ff;color:#fff}
.dark-btn{background:#222;color:#fff}

/* ===== FLASH ===== */
.flash{
animation:flash .2s;
}
@keyframes flash{
0%{opacity:1}
50%{opacity:.2}
100%{opacity:1}
}

/* ===== DARK MODE ===== */
.dark{
background:#111;
color:#fff;
}
.dark nav,
.dark .sidebar,
.dark .camera-card,
.dark .panel{
background:#222 !important;
color:#fff;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
.main{
grid-template-columns:1fr;
}
.camera-card{
aspect-ratio:3/4;
}
}

</style>
</head>

<body>

<nav>
<div><b>📸 Photobooth With Me</b></div>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Gallery</a></li>
</ul>
</nav>

<section class="hero">
<h1>Photobooth With Me</h1>
<p>Korean-style photostrip creator</p>
</section>

<div class="main">

<!-- SIDEBAR -->
<div class="sidebar">

<button onclick="setSession(2)">2 Photos</button>
<button onclick="setSession(4)">4 Photos</button>
<button onclick="setSession(6)">6 Photos</button>

<div id="frameBox">
<h4>Frames</h4>
<div id="frameList"></div>
</div>

<hr>

<!-- STICKERS -->
<button onclick="addSticker('💖')">💖</button>
<button onclick="addSticker('✨')">✨</button>
<button onclick="addSticker('🎀')">🎀</button>
<button onclick="addSticker('🐱')">🐱</button>

<hr>

<button class="primary" onclick="start()">Start</button>
<button class="dark-btn" onclick="document.body.classList.toggle('dark')">Dark</button>

</div>

<!-- CAMERA -->
<div class="camera-section">

<div class="camera-card">

<div class="live-badge">🔴 LIVE</div>

<video id="video" autoplay playsinline></video>

<div id="layer"></div>

</div>

<div id="countdown"></div>

<div class="buttons">
<button class="secondary" onclick="start()">Start</button>
</div>

<div id="photos"></div>

</div>

<!-- PANEL -->
<div class="panel">
<h3>Preview</h3>
<div id="photos"></div>
</div>

</div>

<canvas id="canvas" style="display:none"></canvas>

<script>

const video=document.getElementById("video");
const layer=document.getElementById("layer");
const photosDiv=document.getElementById("photos");
const frameBox=document.getElementById("frameBox");
const frameList=document.getElementById("frameList");

let photos=[];
let sessionCount=4;
let selectedFrame="4grid";

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* FRAME */
function setSession(n){

sessionCount=n;
frameBox.style.display="block";
frameList.innerHTML="";

let frames=[];

if(n==2)frames=[
{name:"Horizontal",type:"2h"},
{name:"Vertical",type:"2v"}
];

if(n==4)frames=[
{name:"Grid 2x2",type:"4grid"}
];

if(n==6)frames=[
{name:"Grid 3x2",type:"6grid"}
];

frames.forEach(f=>{
const div=document.createElement("div");
div.className="frame-item";
div.innerText=f.name;

div.onclick=()=>{
selectedFrame=f.type;
document.querySelectorAll(".frame-item").forEach(e=>e.classList.remove("active"));
div.classList.add("active");
};

frameList.appendChild(div);
});
}

/* STICKER */
function addSticker(t){
const el=document.createElement("div");
el.className="sticker";
el.innerText=t;

el.style.left="120px";
el.style.top="120px";

layer.appendChild(el);

let drag=false,ox=0,oy=0;

el.onpointerdown=e=>{
drag=true;
ox=e.clientX-el.offsetLeft;
oy=e.clientY-el.offsetTop;
};

document.onpointermove=e=>{
if(!drag)return;
el.style.left=(e.clientX-ox)+"px";
el.style.top=(e.clientY-oy)+"px";
};

document.onpointerup=()=>drag=false;
}

/* CAPTURE */
function capture(){
const c=document.createElement("canvas");
c.width=video.videoWidth;
c.height=video.videoHeight;

const ctx=c.getContext("2d");
ctx.drawImage(video,0,0);

photos.push(c.toDataURL());
}

/* START */
async function start(){

photos=[];

for(let i=0;i<sessionCount;i++){

for(let s=3;s>0;s--){
document.getElementById("countdown").innerText=s;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById("countdown").innerText="📸";
capture();
await new Promise(r=>setTimeout(r,500));
}

document.getElementById("countdown").innerText="";
}

</script>

</body>
</html>
