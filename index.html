<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
overflow-x:hidden;
}

/* NAV */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 26px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(12px);
box-shadow:0 2px 20px rgba(0,0,0,.08);
}

.logo{font-weight:bold}

nav ul{
display:flex;
gap:18px;
list-style:none;
}

/* LAYOUT */
.main{
display:grid;
grid-template-columns:260px 1fr 280px;
gap:14px;
max-width:1200px;
margin:18px auto;
padding:0 10px;
}

/* SIDEBAR */
.sidebar{
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:16px;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
}

button{
border:none;
padding:8px 10px;
border-radius:10px;
cursor:pointer;
font-weight:600;
font-size:13px;
}

.start{background:#ff5c8a;color:white}

/* FRAME BOX */
#frameBox{
display:none;
background:white;
padding:10px;
border-radius:12px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
margin-top:10px;
}

.frame-item{
padding:8px;
margin:6px 0;
border-radius:10px;
cursor:pointer;
background:#f3f3f3;
transition:.2s;
}

.frame-item:hover{
background:#eee;
}

.frame-item.active{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
transform:scale(1.02);
}

/* PREVIEW */
.layout-preview{
display:grid;
gap:4px;
height:60px;
margin-top:6px;
}

.layout-2h{grid-template-columns:1fr 1fr}
.layout-2v{grid-template-rows:1fr 1fr}
.layout-4{grid-template-columns:1fr 1fr}
.layout-6{grid-template-columns:1fr 1fr 1fr}

.box{
background:#ddd;
border-radius:4px;
}

/* CAMERA */
.camera-box{
position:relative;
background:white;
border-radius:16px;
overflow:hidden;
}

video{width:100%}

/* STICKERS */
#layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.sticker{
position:absolute;
font-size:32px;
cursor:grab;
user-select:none;
}

.sticker img{
width:60px;
}

/* RIGHT PANEL */
.panel{
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:16px;
padding:12px;
}

.gallery img{
width:100%;
border-radius:10px;
margin-bottom:8px;
}

/* COUNTDOWN */
#countdown{
text-align:center;
font-size:42px;
height:50px;
color:#ff4d6d;
margin-top:8px;
}

</style>
</head>

<body>

<nav>
<div class="logo">📸 Photobooth With Me</div>
<ul><li>Trend</li><li>Frames</li><li>Filters</li></ul>
</nav>

<div class="main">

<!-- LEFT -->
<div class="sidebar">

<button onclick="setSession(2)">2 photos</button>
<button onclick="setSession(4)">4 photos</button>
<button onclick="setSession(6)">6 photos</button>

<div id="frameBox">
<h4>Choose Frame</h4>
<div id="frameList"></div>
</div>

<hr>

<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
<button onclick="addSticker('💖')">💖</button>
<button onclick="addSticker('✨')">✨</button>
<button onclick="addSticker('🎀')">🎀</button>
<button onclick="addSticker('🐻')">🐻</button>
<button onclick="addSticker('🌸')">🌸</button>
<button onclick="addSticker('💫')">💫</button>
<button onclick="addStickerImg('https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif')">🐱</button>
<button onclick="addStickerImg('https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif')">🐱</button>
</div>

<hr>

<button class="start" onclick="start()">Start</button>

</div>

<!-- CENTER -->
<div>

<div class="camera-box">
<video id="video" autoplay playsinline></video>
<div id="layer"></div>
</div>

<div id="countdown"></div>

</div>

<!-- RIGHT -->
<div class="panel">
<h3>Preview</h3>
<div id="gallery"></div>
</div>

</div>

<script>

const video=document.getElementById('video');
const frameBox=document.getElementById('frameBox');
const frameList=document.getElementById('frameList');
const layer=document.getElementById('layer');
const gallery=document.getElementById('gallery');

let sessionCount=4;
let selectedFrame="none";

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* FRAME SYSTEM FIXED */
function setSession(n){

sessionCount=n;

frameBox.style.display="block";
frameList.innerHTML="";

let frames=[];

if(n===2){
frames=[
{name:"2 Horizontal",type:"layout-2h"},
{name:"2 Vertical",type:"layout-2v"}
];
}

if(n===4){
frames=[
{name:"4 Grid",type:"layout-4"},
{name:"4 Clean Grid",type:"layout-4"}
];
}

if(n===6){
frames=[
{name:"6 Grid",type:"layout-6"},
{name:"6 Strip",type:"layout-6"}
];
}

frames.forEach(f=>{

const div=document.createElement("div");
div.className="frame-item";

div.innerHTML=`
<div>${f.name}</div>
<div class="layout-preview ${f.type}">
<div class="box"></div><div class="box"></div>
</div>
`;

div.onclick=()=>{

selectedFrame=f.type;

/* highlight active */
document.querySelectorAll(".frame-item")
.forEach(el=>el.classList.remove("active"));

div.classList.add("active");

console.log("Frame selected:", selectedFrame);
};

frameList.appendChild(div);
});
}

/* STICKERS */
function addSticker(t){

const el=document.createElement('div');
el.className='sticker';
el.innerText=t;

place(el);
}

function addStickerImg(url){

const el=document.createElement('div');
el.className='sticker';

const img=document.createElement('img');
img.src=url;

el.appendChild(img);

place(el);
}

/* DRAG */
function place(el){

el.style.left="120px";
el.style.top="120px";

layer.appendChild(el);

let d=false,ox=0,oy=0;

el.addEventListener('pointerdown',e=>{
d=true;
ox=e.clientX-el.offsetLeft;
oy=e.clientY-el.offsetTop;
});

document.addEventListener('pointermove',e=>{
if(!d) return;
el.style.left=(e.clientX-ox)+'px';
el.style.top=(e.clientY-oy)+'px';
});

document.addEventListener('pointerup',()=>d=false);
}

/* CAPTURE */
function capture(){

const c=document.createElement('canvas');
c.width=video.videoWidth;
c.height=video.videoHeight;

const ctx=c.getContext('2d');
ctx.drawImage(video,0,0);

const img=document.createElement('img');
img.src=c.toDataURL();

gallery.appendChild(img);
}

/* START */
async function start(){

layer.innerHTML="";

for(let i=0;i<sessionCount;i++){

for(let s=3;s>0;s--){
document.getElementById('countdown').innerText=s;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();
await new Promise(r=>setTimeout(r,500));
}

document.getElementById('countdown').innerText="";
}

</script>

</body>
</html>
