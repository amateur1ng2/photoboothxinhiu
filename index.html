<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
overflow-x:hidden;
}

.main{
display:grid;
grid-template-columns:260px 1fr 280px;
gap:14px;
max-width:1200px;
margin:20px auto;
padding:0 10px;
}

/* SIDEBAR */
.sidebar{
background:rgba(255,255,255,.7);
backdrop-filter:blur(10px);
border-radius:16px;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
}

/* STICKERS */
.sticker-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.sticker-btn{
aspect-ratio:1/1;
border:none;
border-radius:12px;
cursor:pointer;
background:white;
font-size:18px;
box-shadow:0 4px 10px rgba(0,0,0,.08);
}

/* CAMERA */
.camera-box{
position:relative;
background:white;
border-radius:16px;
overflow:hidden;
}

video{width:100%}

#layer{
position:absolute;
inset:0;
}

.sticker{
position:absolute;
font-size:32px;
cursor:grab;
}

/* animated sticker */
.sticker img{
width:60px;
}

/* FRAME PICKER */
#frameBox{
margin-top:10px;
display:none;
background:white;
padding:10px;
border-radius:12px;
}

.frame-item{
padding:8px;
margin:6px 0;
border-radius:10px;
cursor:pointer;
background:#f3f3f3;
}

.frame-item:hover{
background:#ff5c8a;
color:white;
}

/* RIGHT */
.panel{
background:rgba(255,255,255,.7);
backdrop-filter:blur(10px);
border-radius:16px;
padding:12px;
}

.gallery img{
width:100%;
border-radius:10px;
margin-bottom:8px;
}

/* layout preview */
.layout-preview{
border:2px solid #ddd;
border-radius:10px;
padding:6px;
margin:6px 0;
cursor:pointer;
}

.layout-box{
display:grid;
gap:4px;
height:80px;
}

.two-h{grid-template-columns:1fr 1fr}
.two-v{grid-template-rows:1fr 1fr}

.four-grid{grid-template-columns:1fr 1fr}
.six-grid{grid-template-columns:1fr 1fr 1fr}
.small{background:#ddd}

</style>
</head>

<body>

<div class="main">

<!-- LEFT -->
<div class="sidebar">

<button onclick="setSession(2)">2 photos</button>
<button onclick="setSession(4)">4 photos</button>
<button onclick="setSession(6)">6 photos</button>

<div id="frameBox">
<h4>Choose Layout</h4>
<div id="frameList"></div>
</div>

<hr>

<div class="sticker-grid">
<button onclick="addSticker('💖')">💖</button>
<button onclick="addSticker('✨')">✨</button>
<button onclick="addSticker('🎀')">🎀</button>
<button onclick="addSticker('🐻')">🐻</button>

<!-- animated cat -->
<button onclick="addStickerImg('https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif')">🐱</button>
<button onclick="addStickerImg('https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif')">🐱</button>

</div>

<button onclick="start()">Start</button>

</div>

<!-- CENTER -->
<div>

<div class="camera-box">
<video id="video" autoplay playsinline></video>
<div id="layer"></div>
</div>

</div>

<!-- RIGHT -->
<div class="panel">
<h3>Preview</h3>
<div class="gallery" id="gallery"></div>
</div>

</div>

<script>

const video=document.getElementById('video');
const frameBox=document.getElementById('frameBox');
const frameList=document.getElementById('frameList');
const gallery=document.getElementById('gallery');
const layer=document.getElementById('layer');

let sessionCount=4;
let selectedLayout="grid";
let images=[];

/* camera */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* SESSION -> GENERATE REAL LAYOUTS */
function setSession(n){

sessionCount=n;
frameBox.style.display="block";
frameList.innerHTML="";

let layouts=[];

if(n===2){
layouts=[
{name:"Split Horizontal",type:"two-h"},
{name:"Split Vertical",type:"two-v"}
];
}

if(n===4){
layouts=[
{name:"2x2 Grid",type:"four-grid"},
{name:"2 Large + 2 Small",type:"four-mix"}
];
}

if(n===6){
layouts=[
{name:"3x2 Grid",type:"six-grid"},
{name:"Vertical Strip",type:"six-strip"}
];
}

/* render UI */
layouts.forEach(l=>{
const div=document.createElement("div");
div.className="layout-preview";

div.innerHTML=`
<div>${l.name}</div>
<div class="layout-box ${l.type}">
<div class="small"></div>
<div class="small"></div>
</div>
`;

div.onclick=()=>{
selectedLayout=l.type;
alert("Selected layout: " + l.name);
};

frameList.appendChild(div);
});
}

/* STICKERS */
function addSticker(t){
const el=document.createElement('div');
el.className='sticker';
el.innerText=t;
place(el);
}

function addStickerImg(url){
const el=document.createElement('div');
el.className='sticker';
const img=document.createElement('img');
img.src=url;
el.appendChild(img);
place(el);
}

/* DRAG */
function place(el){
el.style.left="120px";
el.style.top="120px";
layer.appendChild(el);

let d=false,ox=0,oy=0;

el.addEventListener('pointerdown',e=>{
d=true;
ox=e.clientX-el.offsetLeft;
oy=e.clientY-el.offsetTop;
});

document.addEventListener('pointermove',e=>{
if(!d) return;
el.style.left=(e.clientX-ox)+'px';
el.style.top=(e.clientY-oy)+'px';
});

document.addEventListener('pointerup',()=>d=false);
}

/* CAPTURE (SIMPLE DEMO) */
function capture(){

const c=document.createElement('canvas');
c.width=video.videoWidth;
c.height=video.videoHeight;

const ctx=c.getContext('2d');
ctx.drawImage(video,0,0);

const url=c.toDataURL();
const img=document.createElement('img');
img.src=url;

gallery.appendChild(img);
}

/* START */
async function start(){

images=[];
layer.innerHTML="";

for(let i=0;i<sessionCount;i++){

for(let s=3;s>0;s--){
await new Promise(r=>setTimeout(r,1000));
}

capture();
await new Promise(r=>setTimeout(r,500));
}

}

</script>

</body>
</html>
