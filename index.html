<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
min-height:100vh;
}

/* ===== NAV (GIỮ NGUYÊN 100%) ===== */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 40px;
background:rgba(255,255,255,.85);
backdrop-filter:blur(12px);
box-shadow:0 2px 20px rgba(0,0,0,.08);
}

.logo{font-weight:bold}

nav ul{
display:flex;
gap:20px;
list-style:none;
}

nav li{position:relative}

nav a{
text-decoration:none;
color:#333;
font-weight:600;
padding:8px 12px;
border-radius:10px;
}

nav a:hover{
background:#ff5c8a;
color:white;
}

.dropdown{
position:absolute;
top:40px;
left:0;
background:white;
min-width:200px;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
opacity:0;
visibility:hidden;
transform:translateY(10px);
transition:.2s;
}

nav li:hover .dropdown{
opacity:1;
visibility:visible;
transform:translateY(0);
}

.dropdown a{
display:block;
padding:12px;
}

.dropdown a:hover{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
}

/* ===== LAYOUT MINI (~50%) ===== */
.main{
display:flex;
gap:15px;
max-width:600px;   /* 👈 GIẢM 50% */
margin:auto;
padding:10px;
flex-wrap:wrap;
}

/* sidebar nhỏ lại */
.sidebar{
flex:1;
min-width:180px;
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:16px;
padding:10px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

/* camera nhỏ lại */
.camera{
flex:2;
min-width:280px;
}

.camera-box{
position:relative;
background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

video{
width:100%;
display:block;
}

/* LIVE giữ nhỏ */
.live{
position:absolute;
top:6px;
left:6px;
display:flex;
align-items:center;
gap:5px;
font-size:10px;
font-weight:bold;
background:rgba(255,255,255,.7);
padding:3px 6px;
border-radius:10px;
}

.dot{
width:6px;
height:6px;
background:red;
border-radius:50%;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.6);opacity:.4}
}

/* STICKER */
#layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.sticker{
position:absolute;
font-size:28px;
cursor:grab;
user-select:none;
touch-action:none;
}

/* buttons */
button{
padding:6px 10px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:12px;
margin:3px;
}

.start{background:#ff5c8a;color:white}
.stop{background:#ff3b3b;color:white}
.reset{background:#7b61ff;color:white}

/* countdown */
#countdown{
text-align:center;
font-size:40px;
height:45px;
color:#ff4d6d;
}

</style>
</head>

<body>

<!-- NAV GIỮ NGUYÊN -->
<nav>
<div class="logo">📸 Photobooth With Me</div>

<ul>
<li><a href="#">Trend</a>
<div class="dropdown">
<a>Pink</a>
<a>Neon</a>
<a>Retro</a>
</div>
</li>

<li><a href="#">Frames</a>
<div class="dropdown">
<a>Korean</a>
<a>Minimal</a>
</div>
</li>

<li><a href="#">Filters</a>
<div class="dropdown">
<a>Soft</a>
<a>Vintage</a>
</div>
</li>
</ul>
</nav>

<div class="main">

<!-- SIDEBAR -->
<div class="sidebar">

<button onclick="setPhotos(2)">2</button>
<button onclick="setPhotos(4)">4</button>
<button onclick="setPhotos(6)">6</button>

<hr>

<!-- 🧸 MORE STICKERS -->
<button onclick="addSticker('💖')">💖</button>
<button onclick="addSticker('✨')">✨</button>
<button onclick="addSticker('🎀')">🎀</button>
<button onclick="addSticker('🐻')">🐻</button>
<button onclick="addSticker('🌸')">🌸</button>
<button onclick="addSticker('🧸')">🧸</button>
<button onclick="addSticker('💫')">💫</button>
<button onclick="addSticker('🌷')">🌷</button>

</div>

<!-- CAMERA -->
<div class="camera">

<div class="camera-box">

<div class="live">
<div class="dot"></div> LIVE
</div>

<video id="video" autoplay playsinline></video>
<div id="layer"></div>

</div>

<div id="countdown"></div>

<div>
<button class="start" id="start">Start</button>
<button class="stop" id="stop">Stop</button>
<button class="reset" id="reset">Reset</button>
</div>

</div>

</div>

<script>

const video=document.getElementById('video');
const layer=document.getElementById('layer');

let running=false;
let photoCount=4;
let stickers=[];

/* camera */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* settings */
function setPhotos(n){photoCount=n}

/* 🧸 sticker */
function addSticker(icon){

const el=document.createElement('div');
el.className='sticker';
el.innerText=icon;

el.style.left="100px";
el.style.top="100px";

layer.appendChild(el);
stickers.push(el);

let drag=false;
let ox=0,oy=0;

/* drag */
el.addEventListener('pointerdown',(e)=>{
drag=true;
ox=e.clientX-el.offsetLeft;
oy=e.clientY-el.offsetTop;
});

document.addEventListener('pointermove',(e)=>{
if(!drag) return;
el.style.left=(e.clientX-ox)+'px';
el.style.top=(e.clientY-oy)+'px';
});

document.addEventListener('pointerup',()=>drag=false);

/* resize */
el.addEventListener('wheel',(e)=>{
e.preventDefault();

let s=el.dataset.s?parseFloat(el.dataset.s):1;
s+=e.deltaY*-0.001;
s=Math.max(0.5,Math.min(3,s));

el.dataset.s=s;
el.style.transform=`scale(${s})`;
});
}

/* capture */
function capture(){
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext('2d');
ctx.drawImage(video,0,0);

stickers.forEach(st=>{
const r=st.getBoundingClientRect();
const v=document.querySelector('.camera-box').getBoundingClientRect();

ctx.font="40px Arial";
ctx.fillText(st.innerText,r.left-v.left,r.top-v.top);
});
}

/* start */
document.getElementById('start').onclick=async()=>{
running=true;
layer.innerHTML='';
stickers=[];

for(let i=0;i<photoCount;i++){
if(!running) break;

for(let c=3;c>0;c--){
document.getElementById('countdown').innerText=c;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();
await new Promise(r=>setTimeout(r,500));
}

document.getElementById('countdown').innerText="";
};

/* stop */
document.getElementById('stop').onclick=()=>{
running=false;
document.getElementById('countdown').innerText="";
};

/* reset */
document.getElementById('reset').onclick=()=>{
running=false;
layer.innerHTML='';
stickers=[];
document.getElementById('countdown').innerText="";
};

</script>

</body>
</html>
