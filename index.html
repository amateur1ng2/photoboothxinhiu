<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
overflow-x:hidden;
}

/* ===== NAV ===== */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 28px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(12px);
box-shadow:0 2px 20px rgba(0,0,0,.08);
}

.logo{font-weight:bold}

nav ul{
display:flex;
gap:18px;
list-style:none;
}

nav li{position:relative}

nav a{
text-decoration:none;
color:#333;
font-weight:600;
padding:8px 10px;
border-radius:10px;
}

nav a:hover{
background:#ff5c8a;
color:white;
}

.dropdown{
position:absolute;
top:38px;
left:0;
background:white;
min-width:180px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
opacity:0;
visibility:hidden;
transform:translateY(10px);
transition:.2s;
}

nav li:hover .dropdown{
opacity:1;
visibility:visible;
transform:translateY(0);
}

.dropdown a{
display:block;
padding:10px;
}

.dropdown a:hover{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
}

/* ===== LAYOUT 3 CỘT ===== */
.main{
display:grid;
grid-template-columns:220px 1fr 260px;
gap:14px;
max-width:1200px;
margin:18px auto;
padding:0 10px;
}

@media(max-width:1000px){
.main{
grid-template-columns:1fr;
}
}

/* ===== SIDEBAR LEFT ===== */
.sidebar{
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:16px;
padding:12px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
display:flex;
flex-direction:column;
gap:10px;
}

button{
border:none;
padding:8px 10px;
border-radius:10px;
cursor:pointer;
font-weight:600;
font-size:13px;
}

.start{background:#ff5c8a;color:white}
.stop{background:#ff3b3b;color:white}
.reset{background:#7b61ff;color:white}

/* ===== CAMERA CENTER ===== */
.camera-box{
position:relative;
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

video{
width:100%;
display:block;
transform-origin:center;
}

/* LIVE + ZOOM */
.live{
position:absolute;
top:8px;
left:8px;
display:flex;
align-items:center;
gap:6px;
background:rgba(255,255,255,.8);
padding:5px 10px;
border-radius:12px;
font-size:11px;
}

.dot{
width:7px;height:7px;
background:red;
border-radius:50%;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.6);opacity:.4}
}

/* zoom control */
.zoom-box{
position:absolute;
bottom:10px;
left:10px;
background:rgba(255,255,255,.85);
padding:8px;
border-radius:12px;
font-size:12px;
}

.zoom-box input{
width:120px;
}

/* STICKER */
#layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.sticker{
position:absolute;
font-size:32px;
cursor:grab;
user-select:none;
touch-action:none;
}

/* RIGHT PANEL */
.panel{
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:16px;
padding:12px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.gallery{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:10px;
}

.gallery img{
width:100%;
border-radius:10px;
}

#countdown{
text-align:center;
font-size:42px;
height:50px;
color:#ff4d6d;
margin-top:8px;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">📸 Photobooth With Me</div>

<ul>
<li><a href="#">Trend</a>
<div class="dropdown"><a>Pink</a><a>Retro</a><a>Neon</a></div>
</li>
<li><a href="#">Frames</a>
<div class="dropdown"><a>Korean</a><a>Minimal</a></div>
</li>
<li><a href="#">Filters</a>
<div class="dropdown"><a>Soft</a><a>Vintage</a></div>
</li>
</ul>
</nav>

<!-- MAIN 3 COLUMNS -->
<div class="main">

<!-- LEFT -->
<div class="sidebar">

<button onclick="setPhotos(2)">2 photos</button>
<button onclick="setPhotos(4)">4 photos</button>
<button onclick="setPhotos(6)">6 photos</button>

<hr>

<button onclick="addSticker('💖')">💖</button>
<button onclick="addSticker('✨')">✨</button>
<button onclick="addSticker('🎀')">🎀</button>

<hr>

<button class="start" id="start">Start</button>
<button class="stop" id="stop">Stop</button>
<button class="reset" id="reset">Reset</button>

</div>

<!-- CENTER CAMERA -->
<div>

<div class="camera-box">

<div class="live">
<div class="dot"></div> LIVE
</div>

<video id="video" autoplay playsinline></video>

<div id="layer"></div>

<!-- 🔍 ZOOM CONTROL -->
<div class="zoom-box">
Zoom
<input type="range" min="1" max="2.5" step="0.01" id="zoom">
</div>

</div>

<div id="countdown"></div>

</div>

<!-- RIGHT PANEL -->
<div class="panel">
<h3>Preview</h3>
<div class="gallery" id="gallery"></div>
</div>

</div>

<script>

const video=document.getElementById('video');
const layer=document.getElementById('layer');
const gallery=document.getElementById('gallery');
const zoom=document.getElementById('zoom');

let photoCount=4;
let running=false;
let stickers=[];

/* camera */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* zoom */
zoom.oninput=(e)=>{
video.style.transform=`scale(${e.target.value})`;
};

/* sticker */
function addSticker(icon){

const el=document.createElement('div');
el.className='sticker';
el.innerText=icon;

el.style.left="120px";
el.style.top="120px";

layer.appendChild(el);
stickers.push(el);

let drag=false,ox=0,oy=0;

el.addEventListener('pointerdown',(e)=>{
drag=true;
ox=e.clientX-el.offsetLeft;
oy=e.clientY-el.offsetTop;
});

document.addEventListener('pointermove',(e)=>{
if(!drag) return;
el.style.left=(e.clientX-ox)+'px';
el.style.top=(e.clientY-oy)+'px';
});

document.addEventListener('pointerup',()=>drag=false);
}

/* capture */
function capture(){
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext('2d');
ctx.drawImage(video,0,0);

const url=canvas.toDataURL();
const img=document.createElement('img');
img.src=url;
gallery.appendChild(img);
}

/* start */
document.getElementById('start').onclick=async()=>{
running=true;
layer.innerHTML='';
stickers=[];

for(let i=0;i<photoCount;i++){
if(!running) break;

for(let c=3;c>0;c--){
document.getElementById('countdown').innerText=c;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();
await new Promise(r=>setTimeout(r,500));
}

document.getElementById('countdown').innerText="";
};

document.getElementById('stop').onclick=()=>running=false;

document.getElementById('reset').onclick=()=>{
running=false;
layer.innerHTML='';
stickers=[];
gallery.innerHTML='';
};

function setPhotos(n){photoCount=n}

</script>

</body>
</html>
