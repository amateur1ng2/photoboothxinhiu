<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
overflow-x:hidden;
}

/* LAYOUT */
.main{
display:grid;
grid-template-columns:260px 1fr 280px;
gap:14px;
max-width:1200px;
margin:18px auto;
padding:0 10px;
}

/* SIDEBAR */
.sidebar{
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:16px;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
}

button{
border:none;
padding:8px 10px;
border-radius:10px;
cursor:pointer;
font-weight:600;
font-size:13px;
}

.start{background:#ff5c8a;color:white}

/* FRAME */
#frameBox{
display:none;
background:white;
padding:10px;
border-radius:12px;
margin-top:10px;
}

.frame-item{
padding:8px;
margin:6px 0;
border-radius:10px;
cursor:pointer;
background:#f3f3f3;
transition:.2s;
}

.frame-item.active{
background:linear-gradient(90deg,#ff5c8a,#7b61ff);
color:white;
}

/* CAMERA */
.camera-box{
position:relative;
background:white;
border-radius:16px;
overflow:hidden;
}

video{width:100%}

/* STICKERS */
#layer{
position:absolute;
inset:0;
}

.sticker{
position:absolute;
font-size:32px;
cursor:grab;
user-select:none;
}

.sticker img{
width:60px;
}

/* RIGHT */
.panel{
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:16px;
padding:12px;
}

.gallery-item{
position:relative;
margin-bottom:10px;
}

.gallery-item img{
width:100%;
border-radius:10px;
}

.del{
position:absolute;
top:5px;
right:5px;
background:red;
color:white;
border:none;
border-radius:50%;
width:22px;
height:22px;
cursor:pointer;
}

/* COUNTDOWN */
#countdown{
text-align:center;
font-size:42px;
height:50px;
color:#ff4d6d;
margin-top:8px;
}

/* FINAL STRIP */
.strip{
display:grid;
gap:6px;
background:white;
padding:6px;
border-radius:10px;
margin-bottom:10px;
}

.strip img{
width:100%;
border-radius:6px;
}

</style>
</head>

<body>

<div class="main">

<!-- LEFT -->
<div class="sidebar">

<button onclick="setSession(2)">2 photos</button>
<button onclick="setSession(4)">4 photos</button>
<button onclick="setSession(6)">6 photos</button>

<div id="frameBox">
<h4>Choose Frame</h4>
<div id="frameList"></div>
</div>

<hr>

<button class="start" onclick="start()">Start</button>

</div>

<!-- CENTER -->
<div>

<div class="camera-box">
<video id="video" autoplay playsinline></video>
<div id="layer"></div>
</div>

<div id="countdown"></div>

</div>

<!-- RIGHT -->
<div class="panel">
<h3>Preview</h3>
<div id="gallery"></div>
</div>

</div>

<script>

const video=document.getElementById('video');
const layer=document.getElementById('layer');
const frameBox=document.getElementById('frameBox');
const frameList=document.getElementById('frameList');
const gallery=document.getElementById('gallery');

let sessionCount=4;
let selectedLayout="2x2";
let capturedImages=[];

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* FRAME ENGINE (REAL LOGIC) */
function setSession(n){

sessionCount=n;

frameBox.style.display="block";
frameList.innerHTML="";

let frames=[];

/* REAL LAYOUT OPTIONS */
if(n===2){
frames=[
{name:"Split Horizontal",type:"2h"},
{name:"Split Vertical",type:"2v"}
];
}

if(n===4){
frames=[
{name:"2x2 Grid",type:"4grid"},
{name:"1 Large + 3 Small",type:"4mix"}
];
}

if(n===6){
frames=[
{name:"3x2 Grid",type:"6grid"},
{name:"Vertical Strip",type:"6strip"}
];
}

frames.forEach(f=>{

const div=document.createElement("div");
div.className="frame-item";

div.innerHTML=`${f.name}`;

div.onclick=()=>{

selectedLayout=f.type;

document.querySelectorAll(".frame-item")
.forEach(e=>e.classList.remove("active"));

div.classList.add("active");
};

frameList.appendChild(div);
});
}

/* CAPTURE */
function capture(){

const c=document.createElement('canvas');
c.width=video.videoWidth;
c.height=video.videoHeight;

const ctx=c.getContext('2d');
ctx.drawImage(video,0,0);

capturedImages.push(c.toDataURL());
}

/* 🧠 REAL FRAME RENDER ENGINE */
function renderStrip(){

const c=document.createElement('canvas');
c.width=400;
c.height=600;

const ctx=c.getContext('2d');

ctx.fillStyle="white";
ctx.fillRect(0,0,c.width,c.height);

let imgs=capturedImages.map(src=>{
let img=new Image();
img.src=src;
return img;
});

/* SIMPLE WAIT LOAD */
setTimeout(()=>{

if(selectedLayout==="2h"){
ctx.drawImage(imgs[0],0,0,400,300);
ctx.drawImage(imgs[1],0,300,400,300);
}

if(selectedLayout==="2v"){
ctx.drawImage(imgs[0],0,0,200,600);
ctx.drawImage(imgs[1],200,0,200,600);
}

if(selectedLayout==="4grid"){
ctx.drawImage(imgs[0],0,0,200,300);
ctx.drawImage(imgs[1],200,0,200,300);
ctx.drawImage(imgs[2],0,300,200,300);
ctx.drawImage(imgs[3],200,300,200,300);
}

if(selectedLayout==="6grid"){
let h=200;
ctx.drawImage(imgs[0],0,0,133,h);
ctx.drawImage(imgs[1],133,0,133,h);
ctx.drawImage(imgs[2],266,0,134,h);

ctx.drawImage(imgs[3],0,h,133,h);
ctx.drawImage(imgs[4],133,h,133,h);
ctx.drawImage(imgs[5],266,h,134,h);
}

/* output */
const final=new Image();
final.src=c.toDataURL();

const wrap=document.createElement("div");
wrap.className="gallery-item";

const del=document.createElement("button");
del.className="del";
del.innerText="×";

del.onclick=()=>wrap.remove();

wrap.appendChild(final);
wrap.appendChild(del);

gallery.appendChild(wrap);

capturedImages=[];
},300);

}

/* START */
async function start(){

capturedImages=[];

for(let i=0;i<sessionCount;i++){

for(let s=3;s>0;s--){
document.getElementById('countdown').innerText=s;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();
await new Promise(r=>setTimeout(r,500));
}

document.getElementById('countdown').innerText="";

renderStrip();
}

</script>

</body>
</html>
