<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth With Me</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ffe4ec,#f3e8ff,#e6f7ff);
overflow-x:hidden;
}

/* NAV */
nav{
position:sticky;
top:0;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 26px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(12px);
box-shadow:0 2px 20px rgba(0,0,0,.08);
}

.logo{font-weight:bold}

nav ul{display:flex;gap:18px;list-style:none}

nav li{position:relative}

nav a{
text-decoration:none;
color:#333;
font-weight:600;
padding:8px 10px;
border-radius:10px;
}

/* LAYOUT */
.main{
display:grid;
grid-template-columns:260px 1fr 280px;
gap:14px;
max-width:1200px;
margin:18px auto;
padding:0 10px;
}

/* SIDEBAR */
.sidebar{
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:16px;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
}

/* STICKER GRID */
.sticker-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.sticker-btn{
aspect-ratio:1/1;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:white;
box-shadow:0 4px 10px rgba(0,0,0,.08);
}

/* BUTTONS */
button{
border:none;
padding:8px 10px;
border-radius:10px;
cursor:pointer;
font-weight:600;
font-size:13px;
}

.start{background:#ff5c8a;color:white}
.stop{background:#ff3b3b;color:white}
.reset{background:#7b61ff;color:white}

/* CAMERA */
.camera-box{
position:relative;
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.12);
}

video{width:100%}

/* LIVE */
.live{
position:absolute;
top:8px;
left:8px;
display:flex;
gap:6px;
align-items:center;
background:rgba(255,255,255,.85);
padding:5px 10px;
border-radius:12px;
font-size:11px;
}

/* STICKERS */
#layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.sticker{
position:absolute;
font-size:32px;
cursor:grab;
user-select:none;
touch-action:none;
}

/* animated sticker */
.sticker img{
width:60px;
}

/* RIGHT PANEL */
.panel{
background:rgba(255,255,255,.6);
backdrop-filter:blur(12px);
border-radius:16px;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
}

/* GALLERY */
.gallery{
display:flex;
flex-direction:column;
gap:10px;
}

.img-wrap{
position:relative;
width:100%;
}

.img-wrap img{
width:100%;
border-radius:10px;
cursor:pointer;
display:block;
}

.delete-btn{
position:absolute;
top:6px;
right:6px;
width:22px;
height:22px;
border-radius:50%;
border:none;
background:rgba(255(0,0,0,.8);
color:white;
font-size:12px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

/* MODAL */
#modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
}

#modal img{max-width:80%;border-radius:12px}

/* COUNTDOWN */
#countdown{
text-align:center;
font-size:42px;
height:50px;
color:#ff4d6d;
margin-top:8px;
}

</style>
</head>

<body>

<nav>
<div class="logo">📸 Photobooth With Me</div>
<ul><li>Trend</li><li>Frames</li><li>Filters</li></ul>
</nav>

<div class="main">

<!-- LEFT -->
<div class="sidebar">

<button onclick="setSession(2)">2 photos</button>
<button onclick="setSession(4)">4 photos</button>
<button onclick="setSession(6)">6 photos</button>

<hr>

<div class="sticker-grid">
<button onclick="addSticker('💖')">💖</button>
<button onclick="addSticker('✨')">✨</button>
<button onclick="addSticker('🎀')">🎀</button>
<button onclick="addSticker('🐻')">🐻</button>
<button onclick="addSticker('🌸')">🌸</button>
<button onclick="addSticker('💫')">💫</button>
<button onclick="addSticker('🧸')">🧸</button>
<button onclick="addSticker('🍓')">🍓</button>
</div>

<hr>

<button class="start" onclick="start()">Start</button>
<button class="stop" onclick="stop()">Stop</button>
<button class="reset" onclick="resetAll()">Reset</button>

</div>

<!-- CENTER -->
<div>

<div class="camera-box">

<div class="live">🔴 LIVE</div>

<video id="video" autoplay playsinline></video>
<div id="layer"></div>

</div>

<div id="countdown"></div>

</div>

<!-- RIGHT -->
<div class="panel">
<h3>Preview</h3>
<div class="gallery" id="gallery"></div>
</div>

</div>

<!-- MODAL -->
<div id="modal" onclick="this.style.display='none'">
<img id="modalImg">
</div>

<script>

const video=document.getElementById('video');
const layer=document.getElementById('layer');
const gallery=document.getElementById('gallery');
const modal=document.getElementById('modal');
const modalImg=document.getElementById('modalImg');

let sessionCount=4;
let running=false;
let stickers=[];

/* camera */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* session */
function setSession(n){sessionCount=n}

/* stickers */
function addSticker(icon){

const el=document.createElement('div');
el.className='sticker';
el.innerText=icon;

place(el);
}

/* common sticker logic */
function place(el){

el.style.left="120px";
el.style.top="120px";

layer.appendChild(el);
stickers.push(el);

let drag=false,ox=0,oy=0;

el.addEventListener('pointerdown',(e)=>{
drag=true;
ox=e.clientX-el.offsetLeft;
oy=e.clientY-el.offsetTop;
});

document.addEventListener('pointermove',(e)=>{
if(!drag) return;
el.style.left=(e.clientX-ox)+'px';
el.style.top=(e.clientY-oy)+'px';
});

document.addEventListener('pointerup',()=>drag=false);
}

/* capture */
function capture(){

const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext('2d');
ctx.drawImage(video,0,0);

const url=canvas.toDataURL();

/* gallery item */
const wrap=document.createElement('div');
wrap.className='img-wrap';

const img=document.createElement('img');
img.src=url;

img.onclick=()=>{
modal.style.display='flex';
modalImg.src=url;
};

const del=document.createElement('button');
del.className='delete-btn';
del.innerText='×';

del.onclick=(e)=>{
e.stopPropagation();
wrap.remove();
};

wrap.appendChild(img);
wrap.appendChild(del);
gallery.appendChild(wrap);
}

/* start */
async function start(){

running=true;
layer.innerHTML="";
stickers=[];

for(let i=0;i<sessionCount;i++){

for(let c=3;c>0;c--){
document.getElementById('countdown').innerText=c;
await new Promise(r=>setTimeout(r,1000));
}

document.getElementById('countdown').innerText="📸";
capture();
await new Promise(r=>setTimeout(r,600));
}

document.getElementById('countdown').innerText="";
}

/* stop */
function stop(){
running=false;
}

/* reset */
function resetAll(){
running=false;
layer.innerHTML="";
stickers=[];
gallery.innerHTML="";
document.getElementById('countdown').innerText="";
}

</script>

</body>
</html>
